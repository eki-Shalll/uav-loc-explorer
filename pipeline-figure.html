<script>
const toggle = document.querySelector('#toggle');
const zh = document.querySelector('#figure-zh');
const en = document.querySelector('#figure-en');
toggle.addEventListener('click', () => {
  const showEnglish = en.hidden;
  zh.hidden = showEnglish;
  en.hidden = !showEnglish;
  document.documentElement.lang = showEnglish ? 'en' : 'zh';
  document.title = (showEnglish ? en : zh).querySelector('title').textContent;
  toggle.lang = showEnglish ? 'zh' : 'en';
  toggle.textContent = showEnglish ? '中文' : 'English';
});
</script>
