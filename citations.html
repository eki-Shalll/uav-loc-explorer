    if(n.unread){ctx.beginPath();ctx.moveTo(x,y-r*.65);ctx.lineTo(x+r*.6,y);ctx.lineTo(x,y+r*.65);ctx.lineTo(x-r*.6,y);ctx.closePath();ctx.stroke()}
    ctx.fillStyle=ink;ctx.font='bold 15px system-ui';if(n.new)ctx.fillText('+',x+r+2,y-r+3);
    if(n.open_source==='yes'){ctx.font='bold 11px monospace';ctx.fillText('</>',x-10,y+r+13)}
    if(n.pinned){ctx.beginPath();ctx.arc(x,y,2.5/view.k,0,7);ctx.fill()}
    if(sel||hover===n){ctx.strokeStyle=ink;ctx.lineWidth=2/view.k;ctx.beginPath();ctx.arc(x,y,r+5/view.k,0,7);ctx.stroke();ctx.font='600 15px system-ui';ctx.fillText(n.card_id||n.short_title||n.title.slice(0,36),x+r+8,y+4)}
    else if(mode==='panels'&&n.card_id&&n.index%9===0){ctx.font='12px system-ui';ctx.fillStyle=muted;ctx.fillText(n.card_id,x+r+4,y+4)}
  }
  ctx.restore();ctx.globalAlpha=1;
};
persist=function persistPartition(){const h=new URLSearchParams({lang,mode,partition,new:$('#new').checked?'1':'0',theme:dark?'dark':'light'});history.replaceState(null,'','#'+h)};
const translateBase=translate;
translate=function translatePartition(){
  translateBase();
  const entries=clusterEntries(),chosen=$('#cluster').value;
  $('#partition').value=partition;$('#partitionLabel').textContent=lang==='zh'?'分群版本':'Clustering';
  $('#partition').setAttribute('aria-label',lang==='zh'?'分群版本':'Clustering version');
  $('#partition').options[0].text=lang==='zh'?'新版':'New clustering';
  $('#partition').options[1].text=lang==='zh'?'旧版':'Old clustering';
  $('#cluster').innerHTML=`<option value="">${t('all')}</option>`+entries.map(([k,c])=>`<option value="${k}">C${k} · ${esc(c[lang])}</option>`).join('');
  $('#cluster').value=entries.some(([k])=>k===chosen)?chosen:'';
  $('#legend').innerHTML=entries.map(([k,c])=>{const col=+k===0?(dark?'#999b96':'#898b87'):palette()[(Math.max(1,+k)-1)%palette().length];return `<div class="cluster" style="border-color:${col}"><b>C${k} · ${esc(c[lang])}</b><p>${esc(description(c))}</p></div>`}).join('');
  $('#methodTitle').textContent=lang==='zh'?'分群方法':'Clustering method';
  $('#methodNote').textContent=lang==='zh'
    ?'新版将直接引用、全参考文献耦合与共被引三种网络等权合并，按关联强度归一化，再采用基于分辨率的社区聚类。分群名称是对主题的解释性概括。旧版仅用共被引网络，强制分为 3 组，并单独保留孤立节点。'
  :'The new view combines direct citation, full-reference coupling, and co-citation networks with equal weights, normalizes association strength, and applies resolution-based community detection. Cluster names are interpreted summaries. The old view uses co-citation only, forces three clusters, and keeps isolates separate.';
  $('#nextList').innerHTML=D.nextReads.map(r=>{const n=byId.get(r.id),cluster=n?n.cluster:r.cluster;return `<button class="paper" data-focus="${esc(r.id)}"><span>${t('rank')} ${r.rank} · C${cluster} · ${r.total_links} ${t('edges')}</span>${esc(r.title)}</button>`}).join('');
  details();renderList();colorLegend();draw();persist();
};
setPartition(partition);
Object.defineProperty(window.explorer,'partition',{get(){return partition}});
