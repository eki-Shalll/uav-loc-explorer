s", "formsKey": "node.P7.forms", "role": "an estimate of pose, position or frame alignment in the map frame for the current frame or window, from that frame's own evidence, with quality indicators", "receives": "candidates of P4, evidence of P5 or anchored correspondences of P6; the P3 transform; sensor priors (gravity, height or range, heading, predicted pose)", "forms": "PnP or rigid fit with RANSAC; least squares or gradient descent on residuals (pilot, row53); selection among scored hypotheses (lodloc_v1, lights_out); belief weighting, then mean or cluster (swa_pf, row156); planar transform or heat-map peak (uasthn, wildnav); read-off or blend of retrieved candidates (foundloc, row183, row204); the solver or branch chosen per frame from a statistic of the matches or of the motion (p366, scalloc)", "count": "91", "neighbours": [{"zhKey": "node.neighbour.2", "en": "P4 or P7: a step that only restricts what is examined next is P4; one that yields a usable estimate is P7."}, {"zhKey": "node.neighbour.5", "en": "P7 or P9: P7 computes the estimate or the measurement update for the current frame or window, possibly starting from a predicted belief. P9 retains the result across frames, fuses relative motion and outputs the fused state; reading a point estimate or a covariance off a retained belief is part of that output. P9 at t feeds P4 for t+1. Retention may be implicit, when a card lists no step for it, provided the retained object and its later consumer can be named (in p234 the keyframe's pose and image, consumed by the matching of later frames)."}]}, {"id": "P8", "number": "3.4", "nameKey": "node.P8.name", "exampleKey": "node.P8.example", "roleKey": "node.P8.role", "receivesKey": "node.P8.receives", "formsKey": "node.P8.forms", "role": "a decision on trust: which estimates or correspondences are accepted, or a rejection, or a trigger for a wider search", "receives": "one or several estimates, or anchored correspondences; quality indicators; the predicted state", "forms": "inlier, quality or consistency threshold «runtime» (orthotrack, row44); accept only if error drops «runtime» (ortholoc); uncertainty threshold «runtime» (uasthn, row87); convergence monitor «eval» (lsvl); terrain-dependent error threshold «eval» (row69); innovation gate «runtime» (aeromap3d, row208, p301); choice among solved candidates by reliability and mutual agreement «runtime» (row210, row33); down-weighting «runtime» (naviloc, row176); lost-state test «runtime» (orbslam3)", "count": "35 (33 «runtime», 2 «eval»: lsvl, row69)", "neighbours": [{"zhKey": "node.neighbour.4", "en": "P5 or P8: filtering associations by mutual consistency is P5. P8 judges estimates, tests correspondences against a predicted state, or chooses among several solved estimates."}]}, {"id": "P9", "number": "4.1", "nameKey": "node.P9.name", "exampleKey": "node.P9.example", "roleKey": "node.P9.role", "receivesKey": "node.P9.receives", "formsKey": "node.P9.forms", "role": "whatever estimate persists across frames and is output as the fused result: the posterior at t, carried to t+1, together with the named supporting material it retains (correspondences, a keyframe's pose and image, a previous frame or image, feature caches, the matched map region)", "receives": "accepted estimates or anchored correspondences; relative motion; the previous and the predicted state; other absolute sensors or an initial fix; the estimate of P7 when no P8 exists; the current frame's observation or reference material named by the retention rule (image, features, crop), for retention only", "forms": "the pose itself, possibly smoothed (pilot, row183); the map region last matched (row27); a belief over poses (season_invariant, lsvl); the transform from the odometry frame to the map, by filter (aeromap3d, row30) or by optimization over a window or trajectory (visgeo_opt, naviloc), with landmarks triangulated online (row52, row58, row55, p302)", "count": "41", "neighbours": [{"zhKey": "node.neighbour.3", "en": "P5 or P6: not yet, or already, in map coordinates. One step may do both. Carried anchored correspondences: retention is P9, their anchoring stays P6, their propagation, filtering and extension is P5."}, {"zhKey": "node.neighbour.5", "en": "P7 or P9: P7 computes the estimate or the measurement update for the current frame or window, possibly starting from a predicted belief. P9 retains the result across frames, fuses relative motion and outputs the fused state; reading a point estimate or a covariance off a retained belief is part of that output. P9 at t feeds P4 for t+1. Retention may be implicit, when a card lists no step for it, provided the retained object and its later consumer can be named (in p234 the keyframe's pose and image, consumed by the matching of later frames)."}]}], "patterns": [{"id": "A", "nameKey": "pattern.name.A", "title": "A retrieval only, or retrieval then read-off or blend", "path": "P2s, P3, P4, exit or P4 → P7", "generator": "X1=retrieval, X2=stored, similarity-only exit; R=none", "cards": ["game4loc", "cvd", "foundloc", "row183", "row204"]}, {"id": "A'", "nameKey": "pattern.name.Aprime", "title": "A' compare with the whole stored map, read off", "path": "P2s with P3 → P5, P5 → P7", "generator": "X1=whole map, X2=stored, X3=either; R=none", "cards": ["gis_superglue", "wildnav", "row208", "row23", "row69", "row22", "p297"]}, {"id": "B", "nameKey": "pattern.name.B", "title": "B retrieve, match, attach 3D, solve", "path": "P2s with P3 → P4, P5, P6 or P5 → P7, P7", "generator": "X1=retrieval, X2=stored→selected item, X3=point-wise; R=none", "cards": ["anyvisloc", "curriculumloc", "uavd4l", "row46", "row210", "row164", "row56", "hloc"]}, {"id": "C", "nameKey": "pattern.name.C", "title": "C prior region, match, attach 3D, solve", "path": "P4 given or carried, P2h crop or warp, P5, P6 or P5 → P7, P7", "generator": "X1=prior/carried, X2=at hypothesis, X3=point-wise; R=none or pose", "cards": ["ortholoc", "aeromap3d", "deco", "row30", "row131", "row147", "row110", "row61", "row29", "p345", "p338", "p301"]}, {"id": "D", "nameKey": "pattern.name.D", "title": "D reference at hypothesis, score or align", "path": "P2h render or projection, rule 2, P7 by selection and least squares", "generator": "C's cell, X3 point- or hypothesis-wise, + flag S (reference carries coordinates)", "cards": ["pilot", "pilot_v2", "lodloc_v1", "render2loc", "row40", "row53", "row19", "row32", "row33", "pixloc"]}, {"id": "E", "nameKey": "pattern.name.E", "title": "E recursive belief", "path": "PR, P4 propagated, P2h per hypothesis, P5 hypothesis-wise, P5 → P7, P9 belief", "generator": "X1=carried belief, X2=at hypothesis, X3=hypothesis-wise; R=belief", "cards": ["season_invariant", "swa_pf", "lsvl", "row156", "row80", "row94", "row26", "row57", "mcl", "terrain_pf"]}, {"id": "F", "nameKey": "pattern.name.F", "title": "F odometry anchored by map fixes", "path": "PR, a fix by A to D, P8 gate, P9 transform", "generator": "any A–D front end; R=transform with PR (+P8 gate)", "cards": ["foundloc", "visgeo_opt", "aeromap3d", "naviloc", "row30", "row55", "row58", "row81", "row176", "row194", "row208", "p301", "p302"]}, {"id": "G", "nameKey": "pattern.name.G", "title": "G regression from the observation", "path": "P2s with P3 → P6, or P5 and P7 in one regression", "generator": "X3=regressed — with a stored scene network (crossloc, soar) or as regressed alignment without one (uasthn)", "cards": ["crossloc", "soar", "uasthn", "row161", "row87", "row64"]}, {"id": "H", "nameKey": "pattern.name.H", "title": "H propagated evidence between keyframes", "path": "route 3d, with a pass of pattern C when support runs low", "generator": "X1=carried, X3=point-wise; R=anchored correspondences, with a pattern-C pass when support runs low (route 3d)", "cards": ["orthotrack", "row52", "p234", "row28", "orbslam3"]}, {"id": "I", "nameKey": "pattern.name.I", "title": "I sequence first", "path": "PR and P3 build a local map or mosaic, then A to D register it", "generator": "any A–D after flag Q", "cards": ["footprint_loc", "scalloc", "row116", "row28", "p376", "row27 in part"]}], "fit": "a workflow fits iff, after scope classification and the section-6 register are applied, every step's hand-over is covered by a Role and every consumed input is admitted by the consumer's Receives cell — backward consumption additionally by the closed list of rule 3 or the rule-2 swap. It fits with note under spans or implicit positions; otherwise it misfits, citing the step and the failed test.", "q8": "Q8 (restated by counting layer; supersedes v3.3's single sentence): P8 is exercised in 35 of 93 UAV cards; 33 of these are described as acting during operation and 2 are evaluation-only thresholds (lsvl s10, row69 s7; `p8_recount.tsv`). «runtime» means described as acting while the system runs — it includes selection without a reject option (row33) and soft down-weighting (naviloc, row176), which the state layer does not count as acceptance gates (SCHEMA, fix_acceptance_source: within-solver stopping or soft weighting alone does not qualify), and hier_avl, whose coarse fallback is described but whose implementation is not established (REPORT §7 correction). On failure, at the action level 6 cards widen or refresh the search (hier_avl, orthotrack, scalloc, row27, p231, p358) and 5 coast (aeromap3d, row30, row52, row194, p301); at the Run-F mechanism level S4 = 3 (cs_aerialvl — outside the 93 —, p231, p358) and S3 = 8 (the five coasting cards plus row176, row208, scalloc), while orthotrack and row27 are normal reference refresh and scalloc is in-window rescue. None of the 93 is evaluated after a real in-flight loss.", "anchors": "Anchors (definitions; the SCHEMA_en.md / RULINGS_F.md vocabulary and all state counts are unchanged): output_status annotates what produced the P9/exit output per frame (propagated = rule 5's path at the definition level; the S3 membership of 8 is the Run-F recount, see Q8; frozen carry is a defined class with no fixed-sample member); search modes are defined by the fix event and anchor validity (R-2/R-3), not by P4's input type; fix_acceptance_source classifies the acceptance event's rule wherever it lives, including its absence (row33's runtime selection without a reject option stays top_1_without_reject); retained_state partitions P9 forms, coded for the S2 population only; degradation_trigger and recovery_scope keep their non-P8/non-P4 members as state-only values; update_gate is a pre-Run-F clarification column, carried unchanged — its entries do not map onto P8 membership (foundloc and row26 record gates at non-P8 steps; SCHEMA excludes within-solver stopping and soft weighting); evidence_F and the denominators (fixed 100 = 93 + 7 cs_* state-only cards; targeted separate) are untouched.", "rule0": "(rule 0 — previously external conventions, now binding)\n\n- Unit of judgment: the card step. A step spanning consecutive positions is assigned to the\n  first, the others in a note. A step whose outward hand-over is internal to a position's form\n  (a solver choice, p366 s5; staged estimation, row61 s5–s7) takes that position.\n- The section-1 order is the dependency orientation of the main path, not an execution sequence\n  (pilot s2 renders the reference before s3 prepares the query and fits).\n- Steps the scope paragraph excludes are OUTSIDE, not unassigned; OUTSIDE steps do not count\n  against fit.\n- An `optional` entry that is an interchangeable algorithm, training choice or threshold is a\n  variant of its position, not an option.\n- Counting markers: `g` given, `i` implicit, `prev` carried. Implicit retention requires a named\n  retained object and its consumer. P9 at t feeds P4 for t+1; a carried pose consumed by\n  rendering or cropping is read as P9 → P4 (route 3d), then P4 → P2h.\n- The fit rule: a workflow fits iff, after scope classification and the section-6 register are\n  applied, every step's hand-over is covered by a Role and every consumed input is admitted by\n  the consumer's Receives cell — backward consumption additionally by the closed list of rule 3\n  or the rule-2 swap. It fits with note under spans or implicit positions; otherwise it misfits,\n  citing the step and the failed test.", "rules": "Order of the main path (dependency orientation, rule 0): P1, P2s (before the comparison, usually\nbefore flight); then P3 and P4 in either order; P2h; P5; P6; P7; P8; P9. PR runs beside it.\n\nRule 1, forward routes. A position may consume the hand-over of any earlier position that its\n\"Receives\" cell admits. Positions may be skipped, a system may enter wherever its inputs are\ngiven, and it may exit after P4, P7, P8 or P9. The v3.3 list of skipping routes seen so far is a\nrecord and moves to section 5.3; the exit permission of this rule and the predicted-state typing\nin P4's Role remain normative.\n\nRule 2, one swap. P6 may precede P5 when the reference already carries map coordinates (pilot,\nlodloc_v1, row44, hloc); the swapped hand-over into P5 is admitted by P5's cell.\n\nRule 3, backward routes, a closed list.\n\n- a. Re-rank: P5 → P4, evidence restricts the candidates (anyvisloc, wildnav, row46, row27).\n- b. Refine pass in one frame: P7 → P4 or P2h (lodloc_v1, render2loc, lsgs_loc, row87). In\n  ortholoc the result that re-enters is a homography solved from the first matches.\n- c. On failure: P8 → P4 with a wider search (hier_avl, orthotrack, scalloc, row27, orbslam3).\n  **Note (F8): hier_avl's runtime retrieval-after-failure is not established; scalloc's rescue\n  is an implemented in-window branch retry (P8), not a wider search (section 6, Q8). The\n  action-level support rests on orthotrack s7, row27 s10, p358 s11 and orbslam3.**\n- d. Next frame: P9 → P4; or P9 → P5 or P6, correspondences or a keyframe carried from the\n  previous frame (orthotrack, row52, p234, orbslam3).\n- e. Re-prepare the observation: P7 or P5 → P3. Within one query, the solved pose re-renders the\n  observation's own reconstruction and the similarities re-weight its descriptors (row116).\n  Across frames, the matches adapt the encoder (row147 only¹).\n\n**Extending the closed list is structural and requires two cards from different groups; one-card\nlegs are marked ¹.**\n\nRule 4 of v3.3 (PR → P3, P4, P9) is derivable from the receiving cells and moves to section 5.3\nas a record.\n\nRule 5, coasting. When P8 rejects, or no evidence is available, P9 carries the state forward on\nPR or a motion model alone (aeromap3d, row30, row52, row194). Note: P9's cell already admits\nthese inputs — the rule's content is the failure condition under which this path runs.\n\nA structural change is any addition, removal, split or merge of a position, and any change of a\nRole or Receives cell, of the order, of the swap, of the backward list, of the scope, **or of\nrule 0**. The \"Forms seen\" column, the lists of example cards and section 5 are records:\nextending them is not structural. A forward route that unchanged cells already admit is recorded,\nnot structural.", "sourceHash": "2af03fcabc52f1bb93aa89b99a7a64030964290683b33382c2f350a6d85c0416", "i18n": {"zh": {"app.html_title": "定位流程 · 交互图 v4", "app.skip": "跳至位置说明", "app.title": "定位流程", "app.theme_dark": "切换深色", "app.theme_light": "切换浅色", "app.source_meta": "基于骨架 v3.4 草稿 r3（候选 A）", "app.intro": "点选步骤可查看输入、处理形式和论文案例。选择流程模式可高亮对应步骤。", "app.filters": "流程筛选", "app.route_help": "路线说明：悬停或点击查看示例卡片", "app.keyboard_help": "Tab 移动 · Enter / 空格选择 · Esc 关闭提示或返回步骤", "app.pattern_box": "所选模式", "app.svg_title": "四个阶段的定位流程", "app.svg_description": "选中步骤可查看详情。线的分支用实心圆表示。", "app.legend_aria": "练习占比图例", "app.panel_aria": "位置与路线说明", "app.fit_title": "适配规则 · Fit rule（规则 0）", "app.fit_summary": "先应用范围分类与 §6 未表达事项登记；每一步的交接都由某个 Role 覆盖，且每个已消费输入都被消费者的 Receives 接纳，流程才适配。反向消费还须属于规则 3 封闭清单或规则 2 对调。跨位置步骤或隐含位置记为附注适配；否则指出步骤和失败测试，判为不适配。", "app.fit_details": "判读约定与路线规则 · §0、§3", "app.fit_conventions": "判断单位是卡片步骤。连续跨位置归首位置，其余写附注；位置内部交接仍归该位置。范围外步骤记 OUTSIDE；算法、训练选择或阈值变体不另设 option。g = given，i = implicit，prev = carried。隐含保留必须指明对象与消费者。沿用位姿用于渲染/裁剪时，读为 4.1 → 2.3（3d）→ 2.4。", "app.route_rules": "规则 1：消费更早位置且 Receives 接纳；允许省略、给定输入处进入；仅列明 2.3/3.3/3.4/4.1 可退出。规则 2：参考已有地图坐标时 3.2 可先于 3.1。规则 3 是封闭反馈清单；扩展须来自不同组的两张卡片，单卡片腿标 ¹。规则 5 的内容是拒绝或缺证据时的失败条件。", "app.q8_summary": "3.4 计数与失败动作 · §6 Q8", "app.q8_runtime": "35/93 含 33 个 «runtime»、2 个 «eval»（lsvl s10、row69 s7）。runtime 还含无拒绝选择（row33）、软降权（naviloc、row176），不等于状态层验收门控；hier_avl 粗回退有描述，但实现未建立。", "app.q8_actions": "动作层：6 张扩大/刷新搜索（hier_avl、orthotrack、scalloc、row27、p231、p358），5 张运动传播（aeromap3d、row30、row52、row194、p301）。Run-F 机制层：S4 = 3（cs_aerialvl 不在 93 张内，另有 p231、p358）；S3 = 8（上述 5 张加 row176、row208、scalloc）。orthotrack、row27 是正常参考刷新；scalloc 是窗口内救援。93 张均未在真实飞行失锁后评估。", "app.anchors_summary": "状态层锚点 · §7", "app.anchor.output_status": "output_status：标注每帧 4.1 / 出口的产生方式；propagated 对应规则 5 定义，S3=8 是 Run-F 重计。frozen carry 有定义，无固定样本成员。", "app.anchor.search_modes": "search modes：由 fix 事件和锚有效性定义（R-2/R-3），不由 2.3 输入类型定义。", "app.anchor.fix_acceptance_source": "fix_acceptance_source：分类验收事件规则及其缺席；row33 仍为 top_1_without_reject。", "app.anchor.retained_state": "retained_state：仅对 S2 总体划分 4.1 保留形式。", "app.anchor.degradation": "degradation_trigger / recovery_scope：保留非 3.4 / 非 2.3 的状态层成员。", "app.anchor.update_gate": "update_gate：Run-F 前的澄清列，不对应 3.4 成员；foundloc、row26 的门控在非 3.4 步骤。求解器内部停止和软加权不计验收门控。", "app.anchor.evidence": "evidence_F、固定分母 100 = 93 + 7 cs_*（仅状态层）；定向样本单列。", "app.footer_source": "来源：", "app.footer_scope": "· 草稿 r3 · 候选 A · Explorer v4", "app.footer_offline": "完整离线单文件 · 样式、脚本、图形与内容均内嵌。中文术语依据 GLOSSARY.md。", "app.noscript": "启用 JavaScript 查看流程图。", "language.button_aria": "切换界面语言", "language.to_en": "English", "language.to_zh": "中文", "pattern.label": "路径模式", "pattern.all": "全部步骤", "pattern.name.A": "只检索或读出", "pattern.name.Aprime": "全库比较后读出", "pattern.name.B": "检索、匹配、求解", "pattern.name.C": "先验区域内求解", "pattern.name.D": "按假设渲染与对齐", "pattern.name.E": "递归信念", "pattern.name.F": "底图约束里程计", "pattern.name.G": "由观测回归", "pattern.name.H": "关键帧间传播证据", "p §5.2 示例卡片", "pattern.selected_status": "已选择模式 {id}，路径、生成格和示例卡片已更新。", "filter.backward": "显示反馈", "filter.swap": "显示换序", "filter.pr": "显示运动输入", "filter.reset": "重置视图", "route.3a.name": "重排候选", "route.3a.path": "3.1 → 2.3", "route.3a.note": "证据缩小候选范围。", "route.3b.name": "同帧细化", "route.3b.path": "3.3 → 2.3 / 2.4", "route.3b.note": "在同一帧重入以细化。ortholoc 重入的是从初次匹配求得的单应性。", "route.3c.name": "失败后扩大搜索", "route.3c.path": "3.4 → 2.3", "route.3c.note": "hier_avl 的运行时失败后检索未建立；scalloc 是已实现的窗口内分支重试，不是扩大搜索。动作层支撑：orthotrack s7、row27 s10、p358 s11、orbslam3。", "route.3d.name": "下一帧沿用", "route.3d.path": "4.1(t) → 2.3 / 3.1 / 3.2(t+1)", "route.3d.note": "沿用状态、对应点或关键帧。位姿供渲染/裁剪时，经 2.3 再到 2.4。", "route.3e.name": "重备观测 · 跨帧¹", "route.3e.path": "3.3 / 3.1 → 2.2", "route.3e.note": "同一查询：已解位姿重渲染观测自身重建，相似度重加权描述子（row116）。跨帧：匹配适配编码器，仅 row147¹。¹ 表示单卡片支持。", "route.2.name": "参考已带地图坐标时对调", "route.2.path": "3.2 可先于 3.1", "route.2.note": "条件：参考在匹配前已携带地图坐标。3.1 的 Receives 接纳此已锚定交接。不是无条件双向执行。", "route.5.name": "运动传播", "route.5.path": "2.1 / 运动模型 → 4.1", "route.5.note": "3.4 拒绝，或没有证据时，4.1 仅凭 2.1 或运动模型推进。4.1 已接纳这些输入；本规则规定失败条件。", "route.PR.name": "帧间运动输入", "route.PR.path": "2.1 → 2.2 / 2.3 / 4.1", "route.PR.note": "由连续传感器数据产生相对运动。馈入由接收单元许可；旧规则 4 现为 §5.3 记录。", "route.summary": "路线说明 · §3", "route.summary_pr": "路线说明 · §3 / §5.3", "route.back": "返回步骤", "route.cards_heading": "示例卡片", "route.empty_pr": "运动估计示例见 2.1。", "route.closed_heading": "封闭清单", "route.closed_note": "新增反馈需来自两个不同组的案例。¹ 表示仅有一个案例。", "route.draft_note": "示例为草稿记录，不表示每张卡片实现所有分支。3c 的两个证据限制保留在说明中。", "route.selected_status": "已显示 {id} 路线与示例卡片。", "route.tip_examples": "示例：", "route.tip_pr": "查看 2.1", "route.rule_label": "规则 {id}", "route.tip": "{path}\n{examples}\n{note}", "route.button_aria": "查看 {label} 路线", "text.list_separator": "、", "node.P1.name": "建立地理参考地图", "node.P1.role": "测绘或重建交付的地理配准底图，尚未按定位方法整形。", "node.P1.receives": "测绘影像、LiDAR、公共地理数据。", "node.P1.forms": "正射影像或卫星瓦片；DSM/DEM；网格；3DGS/2DGS；LoD、矢量或 POI；稀疏点云；LiDAR 底图；语义三维边缘；高程模型。", "node.P2s.name": "预制参考库", "node.P2s.role": "未依赖当前待检验假设而准备的底图材料，覆盖全区域或固定假设集。", "node.P2s.receives": "底图、场景专属训练数据；决定渲染、尺度、旋转、照明或预备区域的传感器先验与条件。", "node.P2s.forms": "带描述子的瓦片或视图库；预渲染视图；位姿描述子网格；地标或模型点；语义距离层；几何/文本索引；编码底图的场景网络；按预定航线照明渲染的参考；载入机载参考。", "node.P2h.name": "按候选生成参考", "node.P2h.role": "为一个当前位姿假设准备、与观测同形的底图材料。", "node.P2h.receives": "底图或预存参考；一个假设；上一轮的对齐结果。", "node.P2h.forms": "裁剪；渲染；投影或收集底图点；校正/变换瓦片；检索选中的参考；预期测量。", "node.P3.name": "预处理当前观测", "node.P3.role": "准备哪些帧、何种几何和表示用于比较；若改变几何，还交出回到传感器坐标系的变换。", "node.P3.receives": "原始传感器数据、先验、相对运动、检测器或模型；在假设下将观测变到地图几何时的尺度/高程；上一轮对齐或比较结果。", "node.P3.forms": "选帧；按高度/姿态/航向归一化；通过高程正射校正；多帧正射投影或鸟瞰图；拼接/局部重建；语义或文本；特征/描述子；单目深度；LiDAR 编码；地形高度。", "node.P4.name": "圈定候选位姿/区域", "node.P4.role": "决定下一步检查的候选位姿或底图区域及其已知不确定度；预测状态由 2.3 交出。", "node.P4.receives": "先验、沿用状态、相对运动；2.2 与 1.2 的检索/投票；较粗一轮的证据；3.4 扩大搜索的触发。", "node.P4.forms": "逐查询给定；围绕先验采样；全底图/区域；检索；投票；带或不带运动模型的前次估计；相对运动预测状态；按证据缩小范围。", "node.P5.name": "比对观测与参考", "node.P5.role": "比较观测与参考的结果，尚不是位姿、尚未在地图坐标中；含对应关系的相互一致性筛选。", "node.P5.receives": "2.2；2.4 或 1.2；4.1 上一帧保留的对应点、关键帧位姿与影像、前帧/影像、特征缓存；参考已带地图坐标时的已锚定对应关系（规则 2 对调）。", "node.P5.forms": "匹配与过滤；光流传播匹配；逐假设相似度、似然、热图或损失；代价体；特征/光度残差；回归对齐。", "node.P6.name": "为匹配补上第三维", "node.P6.role": "以地图坐标表达对应关系，维度足以求解位姿。", "node.P6.receives": "对应关系或参考，加上第三维来源；或 2.2 与学习得到的地图。", "node.P6.forms": "«measured» DSM/DEM 抬升、渲染深度、底图原生点、测高仪、多帧自身重建；«measured/learned» 回归坐标；«assumed» 零高程/假定高度平面（hier_avl、row27、p366 s8、p338）。", "node.P7.name": "解算当前位姿", "node.P7.role": "由当前帧/窗口自身证据给出地图坐标系中的位姿、位置或对齐估计，并附质量指标。", "node.P7.receives": "2.3 候选、3.1 证据或 3.2 已锚定对应点；2.2 变换；重力、高度/距离、航向、预测位姿等先验。", "node.P7.forms": "PnP/刚性拟合 + RANSAC；残差最小二乘/梯度下降；已评分假设选择；信念加权均值/聚类；平面变换/热图峰值；检索结果读出/混合；按匹配或运动统计选择求解器/分支。", "node.P8.name": "判断结果是否可信", "node.P8.role": "作出信任决定：接受哪些估计或对应点、拒绝，或触发更大范围搜索。", "node.P8.receives": "一个或多个估计或已锚定对应点；质量指标；预测状态。", "node.P8.forms": "«runtime» 内点/质量/一致性阈值、误差下降、不确定度、新息门控（含 p301）、候选可靠性/一致性选择、软降权、失锁测试；«eval» 收敛监控（lsvl）、地形相关误差阈值（row69）。runtime 不等于状态层验收门控。", "node.P9.name": "融合并传递状态，输出位姿", "node.P9.role": "保留并输出跨帧融合状态：t 时刻后验带至 t+1，并保留具名支撑材料（对应点、关键帧位姿与影像、前帧/影像、特征缓存、已匹配区域）。", "node.P9.receives": "已接受估计或锚定对应点；相对运动；前次/预测状态；其他绝对传感器或初始 fix；无 3.4 时的 3.3 估计；保留规则指明的当前观测/参考影像、特征或裁剪，仅供保留。", "node.P9.forms": "位姿或平滑位姿；上次匹配区域；位姿信念；通过滤波或窗口/轨迹优化保留里程计到地图变换，可含在线三角化地标。", "node.PR.name": "估计帧间运动", "node.PR.role": "传感器自身坐标系中的帧间运动或局部轨迹。", "node.PR.receives": "连续传感器数据。", "node.PR.forms": "视觉惯性里程计；视觉里程计/帧间对齐；给定里程计或惯导。", "node.neighbour.0": "1.2 / 2.4：判断是否针对 2.3 当前待检验的候选位姿或区域。高度、姿态、照明、预定航线、逐查询遥测等条件本身不构成假设依赖。覆盖全区域或独立候选集的材料仍属 1.2，即使逐查询生成（row210 s1）；当前候选所对照的具体材料属 2.4（row161 s3、p338 s1）。p300 s3 的窗口库仍有歧义，冻结标签保留。", "node.neighbour.1": "2.2：比较前对观测的处理，包括选取与参考比较的帧。里程计后端内部的关键帧调度属于 2.1。", "node.neighbour.2": "2.3 / 3.3：只缩小下一步检查范围的是 2.3；给出可用估计的是 3.3。", "node.neighbour.3": "3.1 / 3.2：尚未或已经在地图坐标中，一步可以兼有。跨帧锚定对应点的保留属 4.1；锚定仍属 3.2；传播、过滤、扩展属 3.1。", "node.neighbour.4": "3.1 / 3.4：对应关系相互一致性筛选属 3.1。3.4 判断估计、将对应点与预测状态比较，或在多个已解估计中选择。", "node.neighbour.5": "3.3 / 4.1：当前帧/窗口估计或测量更新属 3.3，可从预测信念开始；跨帧保留、融合相对运动并输出融合状态属 4.1。读取保留信念的点估计/协方差属于该输出。4.1(t) → 2.3(t+1)。隐含保留必须能指明对象及后续消费者，如 p234 的关键帧位姿与影像供后帧匹配。", "panel.position_heading": "步骤详情 · §2", "panel.role": "职责 · Role", "panel.receives": "接收 · Receives", "panel.forms": "已见形式 · Forms（记录）", "panel.source_details": "草稿原文 · Role / Receives / Forms", "panel.role_source": "Role", "panel.receives_source": "Receives", "panel.forms_source": "Forms seen", "panel.neighbours": "相邻位置判别", "panel.neighbour_source": "判别原文", "panel.no_p1_neighbour": "§2 未单列 1.1 的相邻判别。", "panel.q8_heading": "计数解释 · Q8", "panel.q8_note": "runtime 不等于验收门控。无拒绝选择与软降权也在其中；详见下方 §6 Q8。", "panel.mark_split": "41 张的精确划分仍待完整标记。", "panel.route_no_cards": "2.1 示例形式见 2.1 位置；§5.3 未为此输入组合单列示例清单。", "count.P1": "{build} 构建 · {receive} 接收 / {denominator}", "count.P6": "{count} / 93 · 测量≈{measured} · 假设≈{assumed}", "count.P8": "{count} / 93 · runtime {runtime} · eval {eval}", "count.other": "{count} / 93", "legend.high": "≥ 2/3：62–93", "legend.mid": "1/3–< 2/3：31–61", "legend.low": "< 1/3：0–30", "legend.note": "方框颜色越深 = 采 lorer v4", "app.skip": "Skip to position details", "app.title": "Localization Pipeline", "app.theme_dark": "Switch to dark", "app.theme_light": "Switch to light", "app.source_meta": "Based on skeleton v3.4 draft r3 (candidate A)", "app.intro": "Select a step to see its inputs, forms and example cards. Choose a pattern to highlight its steps.", "app.filters": "Pipeline filters", "app.route_help": "Route help: hover or click to see example cards", "app.keyboard_help": "Tab to move · Enter / Space to select · Esc to close a tip or return to the step", "app.pattern_box": "Selected pattern", "app.svg_title": "Localization pipeline in four phases", "app.svg_description": "Select a step for details. Filled dots mark branches.", "app.legend_aria": "Usage-share legend", "app.panel_aria": "Position and route details", "app.fit_title": "Fit rule (rule 0)", "app.fit_summary": "After scope classification and the §6 register of unexpressed items are applied, a workflow fits if every step's hand-over is covered by a Role and every consumed input is admitted by the consumer's Receives cell. Backward consumption must also belong to the closed list of rule 3 or the rule-2 swap. Steps spanning positions or implicit positions are fit with note; otherwise the step and failed test are cited and the workflow misfits.", "app.fit_details": "Reading conventions and route rules · §0, §3", "app.fit_conventions": "The unit of judgment is the card step. A step spanning consecutive positions goes to the first, the others in a note; hand-overs internal to a position stay in it. Out-of-scope steps are OUTSIDE; algorithm, training or threshold variants are not options. g = given, i = implicit, prev = carried. Implicit retention must name its object and consumer. A carried pose used for rendering/cropping reads as 4.1 → 2.3 (3d) → 2.4.", "app.route_rules": "Rule 1: consume any earlier position the Receives cell admits; skipping and entry at given inputs are allowed; only 2.3/3.3/3.4/4.1 may exit. Rule 2: 3.2 may precede 3.1 when the reference already has map coordinates. Rule 3 is a closed feedback list; extension needs two cards from different groups, one-card legs marked ¹. Rule 5 is the failure condition when 3.4 rejects or evidence is missing.", "app.q8_summary": "3.4 counts and failure actions · §6 Q8", "app.q8_runtime": "35 of 93, including 33 «runtime» and 2 «eval» (lsvl s10, row69 s7). runtime also covers selection without reject (row33) and soft down-weighting (naviloc, row176), which are not state-layer acceptance gates; hier_avl's coarse fallback is described but its implementation is not established.", "app.q8_actions": "Action level: 6 cards widen or refresh the search (hier_avl, orthotrack, scalloc, row27, p231, p358); 5 coast (aeromap3d, row30, row52, row194, p301). Run-F mechanism level: S4 = 3 (cs_aerialvl is outside the 93, plus p231, p358); S3 = 8 (the five above plus row176, row208, scalloc). orthotrack and row27 are normal reference refresh; scalloc is in-window rescue. None of the 93 is evaluated after a real in-flight loss.", "app.anchors_summary": "State-layer anchors · §7", "app.anchor.output_status": "output_status: annotates how each frame's 4.1 / exit output was produced; propagated matches the rule 5 definition, S3 = 8 is the Run-F recount. frozen carry is defined, with no fixed-sample member.", "app.anchor.search_modes": "search modes: defined by the fix event and anchor validity (R-2/R-3), not by 2.3's input type.", "app.anchor.fix_acceptance_source": "fix_acceptance_source: classifies the acceptance event's rule, including its absence; row33 stays top_1_without_reject.", "app.anchor.retained_state": "retained_state: partitions 4.1 forms for the S2 population only.", "app.anchor.degradation": "degradation_trigger / recovery_scope: keep their non-3.4 / non-2.3 members as state-only values.", "app.anchor.update_gate": "update_gate: a pre-Run-F clarification column, not mapped to 3.4 membership; foundloc and row26 gate at non-3.4 steps. Within-solver stopping and soft weighting are not acceptance gates.", "app.anchor.evidence": "evidence_F and the fixed denominator 100 = 93 + 7 cs_* (state-only); targeted samples listed separately.", "app.footer_source": "Source:", "app.footer_scope": "· Draft r3 · Candidate A · Explorer v4", "app.footer_offline": "Fully offline single file: styles, scripts, graphics and content are embedded. Terminology follows GLOSSARY.md.", "app.noscript": "Enable JavaScript to view the pipeline.", "language.button_aria": "Switch language", "language.to_en": "English", "language.to_zh": "Chinese", "pattern.label": "Path pattern", "pattern.all": "All steps", "pattern.name.A": "Retrieval/read-off only", "pattern.name.Aprime": "Full-gallery read-off", "pattern.name.B": "Retrieve, match, solve", "pattern.name.C": "Solve in prior region", "pattern.name.D": "Render and align", "pattern.name.E": "Recursive belief", "pattern.name.F": "Map-anchored odometry", "pattern.name.G": "Regress from observation", "pattern.name.H": "Keyframe evidence carry", "pattern.name.I": "Sequence first", "pattern.note.A": "2.3 exits directly, or 2.3 → 3.3 reads off or blends; the two branches are shown side by side.", "pattern.note.Aprime": "Compare directly against the whole stored reference, then read off via 3.1 → 3.3.", "pattern.note.B": "The 3.2 anchoring branch and the direct 3.1 → 3.3 branch are shown side by side.", "pattern.note.C": "Prior or carried hypothesis; nothing retained, or 4.1 retains the pose.", "pattern.note.D": "§5.1: C's cell plus S; §5.2 records rule 2. Side-by-side forms are highlighted; branches are not required on every card.", "pattern.note.E": "Per-hypothesis evidence goes through 3.1 → 3.3 into the 4.1 belief.", "pattern.note.F": "Union of the A–D front ends highlighted; after the 3.4 gate, 4.1 retains the odometry-to-map transform.", "pattern.note.G": "A scene network regresses coordinates, or alignment is regressed without one. 3.1 and 3.3 may happen in one regression.", "pattern.note.H": "Correspondences propagate across frames via 3d; pattern C runs when support runs low.", "pattern.note.I": "2.1 and multi-frame 2.2 build a local map or mosaic first, then A–D register it; front-end union highlighted.", "pattern.cell.retrieval": "retrieval", "pattern.cell.stored": "stored", "pattern.cell.not_limited": "not limited in this row", "pattern.cell.none": "none", "pattern.cell.not_specified": "not specified in this row", "pattern.cell.whole_map": "whole map", "pattern.cell.either": "either", "pattern.cell.stored_selected": "stored → selected item", "pattern.cell.pointwise": "point-wise", "pattern.cell.prior_carried": "prior / carried", "pattern.cell.prior_carried_c": "as C: prior / carried", "pattern.cell.at_hypothesis": "at hypothesis", "pattern.cell.at_hypothesis_c": "as C: at hypothesis", "pattern.cell.none_or_pose": "none or pose", "pattern.cell.none_or_pose_c": "as C: none or pose", "pattern.cell.pointwise_or_hypothesiswise": "point- or hypothesis-wise", "pattern.cell.s": "S", "pattern.cell.carried_belief": "carried belief", "pattern.cell.hypothesiswise": "hypothesis-wise", "pattern.cell.belief": "belief", "pattern.cell.any_frontend": "any A–D front end", "pattern.cell.transform_pr": "transform via 2.1 (with 3.4 gate)", "pattern.cell.scene_network": "stored scene network or none", "pattern.cell.regressed": "regressed", "pattern.cell.carried": "carried", "pattern.cell.c_if_low": "run C when support is low", "pattern.cell.anchored_keyframe": "anchored correspondences / keyframe", "pattern.cell.q": "Q", "pattern.detail_heading": "§5.1–5.2 · Records", "pattern.generator_heading": "§5.1 Generated form:", "pattern.generator.X1": "X1 hypothesis", "pattern.generator.X2": "X2 reference", "pattern.generator.X3": "X3 evidence", "pattern.generator.R": "R retention class", "pattern.generator.flag": "Flags", "pattern.dimension_note": "S = the reference carries map coordinates before matching (rule 2); Q = the observation is built from a sequence (multi-frame 2.2). Dimensions not limited in this row stay open.", "pattern.cards_heading": "§5.2 Example cards", "pattern.selected_status": "Pattern {id} selected; path, generated form and example cards updated.", "filter.backward": "Show feedback", "filter.swap": "Show order swap", "filter.pr": "Show motion inputs", "filter.reset": "Reset view", "route.3a.name": "Re-rank candidates", "route.3a.path": "3.1 → 2.3", "route.3a.note": "Evidence restricts the candidates.", "route.3b.name": "Same-frame refine", "route.3b.path": "3.3 → 2.3 / 2.4", "route.3b.note": "Re-enter within one frame to refine. In ortholoc the re-entering result is a homography solved from the first matches.", "route.3c.name": "Wider search on failure", "route.3c.path": "3.4 → 2.3", "route.3c.note": "hier_avl's runtime retrieval after failure is not established; scalloc's rescue is an implemented in-window branch retry, not a wider search. Action-level support: orthotrack s7, row27 s10, p358 s11, orbslam3.", "route.3d.name": "Carry to next frame", "route.3d.path": "4.1(t) → 2.3 / 3.1 / 3.2(t+1)", "route.3d.note": "Carried state, correspondences or keyframe. When the pose feeds rendering/cropping, it goes via 2.3 to 2.4.", "route.3e.name": "Re-prepare, cross-frame¹", "route.3e.path": "3.3 / 3.1 → 2.2", "route.3e.note": "Same query: the solved pose re-renders the observation's own reconstruction; similarities re-weight descriptors (row116). Across frames: matches adapt the encoder, row147 only¹. ¹ marks single-card support.", "route.2.name": "Swap: anchored reference", "route.2.path": "3.2 may precede 3.1", "route.2.note": "Condition: the reference carries map coordinates before matching. 3.1's Receives admits this anchored hand-over. Not an unconditional bidirectional execution.", "route.5.name": "Coasting", "route.5.path": "2.1 / motion model → 4.1", "route.5.note": "When 3.4 rejects or no evidence is available, 4.1 advances on 2.1 or a motion model alone. 4.1 already admits these inputs; this rule states the failure condition.", "route.PR.name": "Inter-frame motion inputs", "route.PR.path": "2.1 → 2.2 / 2.3 / 4.1", "route.PR.note": "Relative motion is derived from continuous sensor data. Feeding is licensed by the receiving cells; old rule 4 is now a §5.3 record.", "route.summary": "Route details · §3", "route.summary_pr": "Route details · §3 / §5.3", "route.back": "Back to step", "route.cards_heading": "Example cards", "route.empty_pr": "See 2.1 for motion-estimation examples.", "route.closed_heading": "Closed list", "route.closed_note": "Adding a feedback route requires cards from two different groups. ¹ marks single-card support.", "route.draft_note": "Draft records; 3c keeps two evidence limits.", "route.selected_status": "Route {id} and example cards shown.", "route.tip_examples": "Examples:", "route.tip_pr": "See 2.1", "route.rule_label": "Rule {id}", "route.tip": "{path}\n{examples}\n{note}", "route.button_aria": "View {label} route", "text.list_separator": ", ", "node.P1.name": "Build the georeferenced map", "node.P1.role": "The georeferenced map as surveying or reconstruction delivers it, not yet shaped for a localization method.", "node.P1.receives": "Survey images, LiDAR, public geodata.", "node.P1.forms": "Orthoimage or satellite tiles; orthoimage + DSM/DEM; mesh; 3DGS or 2DGS; LoD or vector model, POI database; sparse point cloud; LiDAR map; semantic 3D edges; elevation model.", "node.P2s.name": "Pre-build the reference library", "node.P2s.role": "Map-derived material prepared for comparison without knowing the pose hypothesis: for the whole area or a fixed set of hypotheses.", "node.P2s.receives": "The map; scene-specific training data; sensor priors and conditions that fix how the reference is rendered or which part is prepared (scale, rotation, illumination, planned region).", "node.P2s.forms": "Gallery of tiles or views with descriptors; pre-rendered views; descriptor grid over poses; landmarks or model points; semantic distance layers; geometric or text index; scene network encoding the map; reference rendered for presumed illumination along the planned route; on-board stored reference.", "node.P2h.name": "Make the reference at each candidate", "node.P2h.role": "Map-derived material prepared for one pose hypothesis, in the observation's form.", "node.P2h.receives": "The map or the stored reference; a hypothesis; an alignment from an earlier pass.", "node.P2h.forms": "Crop; render; projected or gathered map points; rectified or warped tile; stored item selected by retrieval; expected measurement.", "node.P3.name": "Preprocess the current observation", "node.P3.role": "Which frames, in which geometry and representation, are prepared for comparison; and the transform back to the sensor frame if geometry was changed.", "node.P3.receives": "Raw sensor data, priors, relative motion, a stored detector or model; the map's scale or elevation with a hypothesis when the observation is brought into map geometry; an alignment or comparison result of an earlier pass.", "node.P3.forms": "Frame choice; normalization by height, attitude or heading; orthorectification through elevation; multi-frame orthoprojection or bird's-eye view; mosaic or local reconstruction; semantics or text; features/descriptors; monocular depth; LiDAR encoding; terrain height.", "node.P4.name": "Narrow down candidate poses / regions", "node.P4.role": "Where to look: the candidate poses or map regions to examine next, with their uncertainty if known; the predicted state is a 2.3 hand-over.", "node.P4.receives": "A prior, the carried state, relative motion; 2.2 with 1.2 (retrieval or voting); evidence of a coarser pass; a wider-search trigger of 3.4.", "node.P4.forms": "Given per query; sampled around a prior; whole map or region; retrieval; voting; previous estimate with or without a motion model; state predicted from relative motion; narrowed by evidence.", "node.P5.name": "Compare observation with reference", "node.P5.role": "The outcome of comparing observation and reference, not yet a pose and not yet in map coordinates; includes filtering associations by mutual consistency.", "node.P5.receives": "2.2; 2.4 or 1.2; carried material of the previous frame from 4.1 (correspondences, keyframe pose and image, previous frame or image, feature caches); anchored associations when the reference carries map coordinates (rule-2 swap).", "node.P5.forms": "Matches and their filters; matches propagated by optical flow; similarity, likelihood, heat-map or loss per hypothesis; cost volume; feature or photometric residuals; regressed alignment.", "node.P6.name": "Lift matches into 3-D map coordinates", "node.P6.role": "Associations expressed in map coordinates, in enough dimensions to solve the pose.", "node.P6.receives": "Associations or the reference, with a source of the third dimension; or 2.2 with a learned map.", "node.P6.forms": "«measured» DSM/DEM lift, rendered depth, map-native points, altimeter, the observation's own reconstruction; «measured/learned» regressed coordinates; «assumed» zero-height or assumed-height plane (hier_avl, row27, p366 s8, p338).", "node.P7.name": "Solve the current pose", "node.P7.role": "An estimate of pose, position or frame alignment in the map frame for the current frame or window, from that frame's own evidence, with quality indicators.", "node.P7.receives": "Candidates of 2.3, evidence of 3.1 or anchored correspondences of 3.2; the 2.2 transform; sensor priors (gravity, height or range, heading, predicted pose).", "node.P7.forms": "PnP or rigid fit with RANSAC; least squares or gradient descent on residuals; selection among scored hypotheses; belief weighting then mean or cluster; planar transform or heat-map peak; read-off or blend of retrieved candidates; solver or branch chosen per frame from match or motion statistics.", "node.P8.name": "Accept or reject the result", "node.P8.role": "A decision on trust: which estimates or correspondences are accepted, or a rejection, or a trigger for a wider search.", "node.P8.receives": "One or several estimates, or anchored correspondences; quality indicators; the predicted state.", "node.P8.forms": "«runtime» inlier, quality or consistency threshold, error drop, uncertainty, innovation gate (incl. p301), reliability/agreement selection, down-weighting, lost-state test; «eval» convergence monitor (lsvl), terrain-dependent error threshold (row69). runtime is not a state-layer acceptance gate.", "node.P9.name": "Fuse, carry the state, output the pose", "node.P9.role": "Whatever estimate persists across frames and is output as the fused result: the posterior at t, carried to t+1, together with the named supporting material it retains (correspondences, keyframe pose and image, previous frame or image, feature caches, matched map region).", "node.P9.receives": "Accepted estimates or anchored correspondences; relative motion; the previous and predicted state; other absolute sensors or an initial fix; the 3.3 estimate when no 3.4 exists; current observation or reference material named by the retention rule, for retention only.", "node.P9.forms": "The pose, possibly smoothed; the map region last matched; a belief over poses; the odometry-to-map transform retained by filter or window/trajectory optimization, possibly with landmarks triangulated online.", "node.PR.name": "Estimate inter-frame motion", "node.PR.role": "Motion between frames, or a local trajectory, in the sensor's own frame.", "node.PR.receives": "Consecutive sensor data.", "node.PR.forms": "Visual-inertial odometry; visual odometry or frame-to-frame alignment; supplied odometry or inertial navigation.", "node.neighbour.0": "1.2 or 2.4: prepared without, or for, the hypothesis under examination (the candidate pose or region 2.3 hands over). Priors fixing rendering, scale, rotation or region (height, attitude, illumination, route, telemetry) do not make a reference hypothesis-conditioned. Material for the whole area or a set independent of the current candidate is 1.2 even if built per query (row210 s1); the item the current hypothesis is examined against is 2.4 (row161 s3, p338 s1). p300 s3 stays ambiguous.", "node.neighbour.1": "2.2: everything done to the observation before comparison, including the choice of frames to compare with the reference. Keyframe scheduling inside an odometry back end belongs to 2.1.", "node.neighbour.2": "2.3 or 3.3: a step that only restricts what is examined next is 2.3; one that yields a usable estimate is 3.3.", "node.neighbour.3": "3.1 or 3.2: not yet, or already, in map coordinates; one step may do both. For carried anchored correspondences, retention is 4.1, anchoring stays 3.2, propagation, filtering and extension is 3.1.", "node.neighbour.4": "3.1 or 3.4: filtering associations by mutual consistency is 3.1. 3.4 judges estimates, tests correspondences against a predicted state, or chooses among several solved estimates.", "node.neighbour.5": "3.3 or 4.1: 3.3 computes the estimate or measurement update for the current frame or window, possibly from a predicted belief. 4.1 retains across frames, fuses relative motion and outputs the fused state, incl. point estimate or covariance read off the belief. 4.1(t) → 2.3(t+1). Implicit retention must name the object and its consumer, e.g. p234's keyframe pose and image for later matching.", "panel.position_heading": "Step details · §2", "panel.role": "Role", "panel.receives": "Receives", "panel.forms": "Forms seen (records)", "panel.source_details": "Draft source · Role / Receives / Forms", "panel.role_source": "Role", "panel.receives_source": "Receives", "panel.forms_source": "Forms seen", "panel.neighbours": "Telling neighbours apart", "panel.neighbour_source": "Source text", "panel.no_p1_neighbour": "§2 lists no neighbour rule for 1.1.", "panel.q8_heading": "Count interpretation · Q8", "panel.q8_note": "runtime is not an acceptance gate. Selection without reject and soft down-weighting are included; see §6 Q8 below.", "panel.mark_split": "The exact split of the 41 cards awaits full marking.", "panel.route_no_cards": "2.1 example forms are under the 2.1 position; §5.3 lists no examples for this input combination.", "count.P1": "{build} build · {receive} receive / {denominator}", "count.P6": "{count} / 93 · measured≈{measured} · assumed≈{assumed}", "count.P8": "{count} / 93 · runtime {runtime} · eval {eval}", "count.other": "{count} / 93", "legend.high": "≥ 2/3: 62–93", "legend.mid": "1/3 to < 2/3: 31–61", "legend.low": "< 1/3: 0–30", "legend.note": "Darker boxes = more papers use the step", "legend.forward": "Forward dependency", "status.node_updated": "{id} {name}, position details updated.", "tip.position": "Position details", "tip.route_examples": "Examples:", "tip.pr_location": "See 2.1 position", "theme.aria": "Switch color theme", "view.detailed": "Detailed", "view.toggle": "Toggle view", "compact.view": "Compact", "compact.return_label": "Retry within the frame", "compact.carried_label": "Carry to next frame", "phase.1": "Phase 1 Offline: build map & reference library", "node.P1.example": "orthophoto · DSM · 3-D model", "node.P2s.example": "tiles · pre-renders · descriptor index", "phase.2": "Phase 2 Per frame: prepare", "node.PR.example": "VO · VIO · INS", "node.P3.example": "select frames · rectify · extract features", "node.P4.example": "prior · motion prediction · retrieval", "node.P2h.example": "crop · render · project map points", "phase.3": "Phase 3 Per frame: match & solve", "node.P5.example": "feature matches · similarity · residuals", "node.P6.example": "DSM height · rendered depth · plane assumption", "node.P7.example": "PnP · homography · filter update", "node.P8.example": "inlier count · uncertainty · innovation gate", "phase.4": "Phase 4 Across frames: fuse & carry", "node.P9.example": "filter / optimization · keep keyframes & matches", "column.obs": "Observation side", "column.main": "Localization main line", "column.map": "Map side", "count.canvas": "{count} / 93 papers", "panel.skeleton_code": "Skeleton code", "panel.pattern_cards": "Example cards from related patterns", "panel.no_pattern_cards": "The pattern table lists no examples specifically for this step.", "panel.routes": "Inspect routes and examples", "panel.coasting": "When the result is rejected or evidence is unavailable, 4.1 advances on 2.1 or a motion model alone (rule 5).", "pattern.steps": "Highlighted steps", "legend.semantics": "An arrow means the later step uses the earlier step’s output. Every step is optional.", "legend.coast": "When rejected or evidence is missing, advance the state using motion alone.", "compact.widen_label": "Rejected → widen the search", "compact.return_path": "Match & solve → 2.3", "compact.return_note": "Groups same-frame candidate re-ranking, refinement and observation preparation. Individual endpoints appear below.", "edge.dependency": "{from} → {to}", "edge.P1.P2s": "Georeferenced map", "edge.P2s.P2h": "Map tiles, pre-rendered views or map points", "edge.P2s.P4": "Reference library and retrieval index", "edge.P2s.P5": "Stored reference", "edge.P2s.P6": "Scene network or map coordinates", "edge.P3.P4": "Retrieval features from the current observation", "edge.P3.P5": "Prepared observation", "edge.P3.P6": "Observation and learned map", "edge.P4.P2h": "Candidate poses or regions", "edge.P4.P7": "Candidate poses or regions", "edge.P2h.P5": "Reference at the candidate", "edge.P2h.P6": "Map coordinates or depth carried by the reference", "edge.P5.P6": "Matches and a source for the third dimension", "edge.P5.P7": "Matches, similarity or residuals", "edge.P6.P7": "Associations in map coordinates", "edge.P7.P8": "Pose estimate and quality indicators", "edge.P7.P9": "Current pose estimate", "edge.P8.P9": "Accepted estimate or associations"}}}</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const DATA = JSON.parse($('explorer-data').textContent);
function hashParams(){return new URLSearchParams(window.location.hash.replace(/^#/,''));}
let activeLang=hashParams().get('lang')==='en'?'en':'zh';
function tr(key, values={}){
 const value=DATA.i18n[activeLang][key];
 if(typeof value!=='string')throw new Error('Missing '+activeLang+' translation: '+key);
 return value.replace(/\{([a-zA-Z0-9_]+)\}/g,(match,name)=>Object.prototype.hasOwnProperty.call(values,name)?String(values[name]):match);
}
const nodeById=Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
const nodeName=n=>tr(n.nameKey);
const stepTitle=n=>n.number+'  '+nodeName(n);
const numbered=value=>value.replace(/\b(?:P2[sh]|P[13456789R])\b/g,id=>nodeById[id].number);
const patternName=p=>tr(p.nameKey);
window.tr=tr;
const SVG_NS = 'http://www.w3.org/2000/svg';
const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const clean = text => text.replace(/\*\*/g, '');
const countText = n => n.id==='P1' ? tr('count.P1',{build:32,receive:60,denominator:93}) : n.id==='P8' ? tr('count.P8',{count:35,runtime:33,eval:2}) : n.id==='P6' ? tr('count.P6',{count:41,measured:37,assumed:4}) : tr('count.other',{count:n.count});
let selectedNode='P4', selectedRoute=null, tipTarget=null;
const routeData = {
 '3a':{group:'backward',nameKey:'route.3a.name',pathKey:'route.3a.path',noteKey:'route.3a.note',cards:['anyvisloc','wildnav','row46','row27']},
 '3b':{group:'backward',nameKey:'route.3b.name',pathKey:'route.3b.path',noteKey:'route.3b.note',cards:['lodloc_v1','render2loc','lsgs_loc','row87','ortholoc']},
 '3c':{group:'backward',nameKey:'route.3c.name',pathKey:'route.3c.path',noteKey:'route.3c.note',cards:['hier_avl','orthotrack','scalloc','row27','orbslam3','p358']},
 '3d':{group:'backward',nameKey:'route.3d.name',pathKey:'route.3d.path',noteKey:'route.3d.note',cards:['orthotrack','row52','p234','orbslam3']},
 '3e':{group:'backward',nameKey:'route.3e.name',pathKey:'route.3e.path',noteKey:'route.3e.note',cards:['row116','row147¹']},
 '2':{group:'swap',nameKey:'route.2.name',pathKey:'route.2.path',noteKey:'route.2.note',cards:['pilot','lodloc_v1','row44','hloc']},
 '5':{group:'coast',nameKey:'route.5.name',pathKey:'route.5.path',noteKey:'route.5.note',cards:['aeromap3d','row30','row52','row194']},
 'PR':{group:'pr',nameKey:'route.PR.name',pathKey:'route.PR.path',noteKey:'route.PR.note',cards:[]}
};

const patternSpec={
 'A':{nodes:['P2s','P3','P4','P7'],edges:[['P2s','P4'],['P3','P4'],['P4','P7'],['P4','out'],['P7','out']],routes:[],cells:['pattern.cell.retrieval','pattern.cell.stored','pattern.cell.not_limited','pattern.cell.none','pattern.cell.not_specified'],noteKey:'pattern.note.A'},

 viewButton.setAttribute('aria-label',tr('view.toggle')+' · '+viewButton.textContent);
 viewButton.setAttribute('aria-pressed',String(currentView==='detailed'));
 $('toggle-swap').closest('label').hidden=currentView==='compact';
}
function setView(view){
 if(view===currentView)return;
 currentView=view;
 updateViewButton();
 hideTip();
 draw();
}
viewButton.onclick=()=>{
 const next=currentView==='compact'?'detailed':'compact';
 const params=hashParams();
 params.set('view',next);
 params.set('lang',activeLang);
 history.replaceState(null,'','#'+params);
 setView(next);
};
window.addEventListener('hashchange',()=>setView(hashParams().get('view')==='detailed'?'detailed':'compact'));
window.addEventListener('explorer-language-change',updateViewButton);
updateViewButton();

setLanguage(activeLang,false);
setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
$('language').onclick=()=>setLanguage(activeLang==='zh'?'en':'zh');
window.addEventListener('hashchange',()=>{const lang=hashParams().get('lang');const next=lang==='en'?'en':'zh';if(next!==activeLang)setLanguage(next,false);});
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
$('pattern').onchange=renderPattern;
const routeFilters=['backward','swap','pr'];
for(const group of routeFilters)$('toggle-'+group).onchange=()=>{hideTip();draw();};
$('reset').onclick=()=>{
 $('pattern').value='';
 for(const group of routeFilters)$('toggle-'+group).checked=true;
 renderPattern();
 showNode('P4');
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('tooltip').hidden){hideTip();}else if(selectedRoute){showNode(selectedNode);const target=document.querySelector('[data-node="'+selectedNode+'"]');if(target)target.focus();hideTip();}}});
window.addEventListener('scroll',()=>{if(tipTarget&&(tipTarget===document.activeElement||tipTarget.matches(':hover')))showTip(tipTarget,$('tooltip').textContent);else hideTip();},{passive:true});window.addEventListener('resize',hideTip);
</script>
</body>
</html>
