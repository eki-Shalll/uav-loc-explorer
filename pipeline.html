mined next is P4; one that yields a usable estimate is P7."}, {"zhKey": "node.neighbour.5", "en": "P7 or P9: P7 computes the estimate or the measurement update for the current frame or window, possibly starting from a predicted belief. P9 retains the result across frames, fuses relative motion and outputs the fused state; reading a point estimate or a covariance off a retained belief is part of that output. P9 at t feeds P4 for t+1. Retention may be implicit, when a card lists no step for it, provided the retained object and its later consumer can be named (in p234 the keyframe's pose and image, consumed by the matching of later frames)."}]}, {"id": "P8", "nameKey": "node.P8.name", "nameEn": "Check", "roleKey": "node.P8.role", "receivesKey": "node.P8.receives", "formsKey": "node.P8.forms", "role": "a decision on trust: which estimates or correspondences are accepted, or a rejection, or a trigger for a wider search", "receives": "one or several estimates, or anchored correspondences; quality indicators; the predicted state", "forms": "inlier, quality or consistency threshold «runtime» (orthotrack, row44); accept only if error drops «runtime» (ortholoc); uncertainty threshold «runtime» (uasthn, row87); convergence monitor «eval» (lsvl); terrain-dependent error threshold «eval» (row69); innovation gate «runtime» (aeromap3d, row208, p301); choice among solved candidates by reliability and mutual agreement «runtime» (row210, row33); down-weighting «runtime» (naviloc, row176); lost-state test «runtime» (orbslam3)", "count": "35 (33 «runtime», 2 «eval»: lsvl, row69)", "neighbours": [{"zhKey": "node.neighbour.4", "en": "P5 or P8: filtering associations by mutual consistency is P5. P8 judges estimates, tests correspondences against a predicted state, or chooses among several solved estimates."}]}, {"id": "P9", "nameKey": "node.P9.name", "nameEn": "Carried state", "roleKey": "node.P9.role", "receivesKey": "node.P9.receives", "formsKey": "node.P9.forms", "role": "whatever estimate persists across frames and is output as the fused result: the posterior at t, carried to t+1, together with the named supporting material it retains (correspondences, a keyframe's pose and image, a previous frame or image, feature caches, the matched map region)", "receives": "accepted estimates or anchored correspondences; relative motion; the previous and the predicted state; other absolute sensors or an initial fix; the estimate of P7 when no P8 exists; the current frame's observation or reference material named by the retention rule (image, features, crop), for retention only", "forms": "the pose itself, possibly smoothed (pilot, row183); the map region last matched (row27); a belief over poses (season_invariant, lsvl); the transform from the odometry frame to the map, by filter (aeromap3d, row30) or by optimization over a window or trajectory (visgeo_opt, naviloc), with landmarks triangulated online (row52, row58, row55, p302)", "count": "41", "neighbours": [{"zhKey": "node.neighbour.3", "en": "P5 or P6: not yet, or already, in map coordinates. One step may do both. Carried anchored correspondences: retention is P9, their anchoring stays P6, their propagation, filtering and extension is P5."}, {"zhKey": "node.neighbour.5", "en": "P7 or P9: P7 computes the estimate or the measurement update for the current frame or window, possibly starting from a predicted belief. P9 retains the result across frames, fuses relative motion and outputs the fused state; reading a point estimate or a covariance off a retained belief is part of that output. P9 at t feeds P4 for t+1. Retention may be implicit, when a card lists no step for it, provided the retained object and its later consumer can be named (in p234 the keyframe's pose and image, consumed by the matching of later frames)."}]}, {"id": "PR", "nameKey": "node.PR.name", "nameEn": "Relative motion", "roleKey": "node.PR.role", "receivesKey": "node.PR.receives", "formsKey": "node.PR.forms", "role": "motion between frames, or a local trajectory, in the sensor's own frame", "receives": "consecutive sensor data", "forms": "visual-inertial odometry (foundloc, row176); visual odometry or frame-to-frame alignment (visgeo_opt, row58); supplied odometry or inertial navigation (swa_pf, terrain_pf, p301)", "count": "30", "neighbours": [{"zhKey": "node.neighbour.1", "en": "P3: everything done to the observation before comparison, including the choice of the frames to compare with the reference. Keyframe scheduling inside an odometry back end belongs to PR."}]}], "patterns": [{"id": "A", "nameKey": "pattern.name.A", "title": "A retrieval only, or retrieval then read-off or blend", "path": "P2s, P3, P4, exit or P4 → P7", "generator": "X1=retrieval, X2=stored, similarity-only exit; R=none", "cards": ["game4loc", "cvd", "foundloc", "row183", "row204"]}, {"id": "A'", "nameKey": "pattern.name.Aprime", "title": "A' compare with the whole stored map, read off", "path": "P2s with P3 → P5, P5 → P7", "generator": "X1=whole map, X2=stored, X3=either; R=none", "cards": ["gis_superglue", "wildnav", "row208", "row23", "row69", "row22", "p297"]}, {"id": "B", "nameKey": "pattern.name.B", "title": "B retrieve, match, attach 3D, solve", "path": "P2s with P3 → P4, P5, P6 or P5 → P7, P7", "generator": "X1=retrieval, X2=stored→selected item, X3=point-wise; R=none", "cards": ["anyvisloc", "curriculumloc", "uavd4l", "row46", "row210", "row164", "row56", "hloc"]}, {"id": "C", "nameKey": "pattern.name.C", "title": "C prior region, match, attach 3D, solve", "path": "P4 given or carried, P2h crop or warp, P5, P6 or P5 → P7, P7", "generator": "X1=prior/carried, X2=at hypothesis, X3=point-wise; R=none or pose", "cards": ["ortholoc", "aeromap3d", "deco", "row30", "row131", "row147", "row110", "row61", "row29", "p345", "p338", "p301"]}, {"id": "D", "nameKey": "pattern.name.D", "title": "D reference at hypothesis, score or align", "path": "P2h render or projection, rule 2, P7 by selection and least squares", "generator": "C's cell, X3 point- or hypothesis-wise, + flag S (reference carries coordinates)", "cards": ["pilot", "pilot_v2", "lodloc_v1", "render2loc", "row40", "row53", "row19", "row32", "row33", "pixloc"]}, {"id": "E", "nameKey": "pattern.name.E", "title": "E recursive belief", "path": "PR, P4 propagated, P2h per hypothesis, P5 hypothesis-wise, P5 → P7, P9 belief", "generator": "X1=carried belief, X2=at hypothesis, X3=hypothesis-wise; R=belief", "cards": ["season_invariant", "swa_pf", "lsvl", "row156", "row80", "row94", "row26", "row57", "mcl", "terrain_pf"]}, {"id": "F", "nameKey": "pattern.name.F", "title": "F odometry anchored by map fixes", "path": "PR, a fix by A to D, P8 gate, P9 transform", "generator": "any A–D front end; R=transform with PR (+P8 gate)", "cards": ["foundloc", "visgeo_opt", "aeromap3d", "naviloc", "row30", "row55", "row58", "row81", "row176", "row194", "row208", "p301", "p302"]}, {"id": "G", "nameKey": "pattern.name.G", "title": "G regression from the observation", "path": "P2s with P3 → P6, or P5 and P7 in one regression", "generator": "X3=regressed — with a stored scene network (crossloc, soar) or as regressed alignment without one (uasthn)", "cards": ["crossloc", "soar", "uasthn", "row161", "row87", "row64"]}, {"id": "H", "nameKey": "pattern.name.H", "title": "H propagated evidence between keyframes", "path": "route 3d, with a pass of pattern C when support runs low", "generator": "X1=carried, X3=point-wise; R=anchored correspondences, with a pattern-C pass when support runs low (route 3d)", "cards": ["orthotrack", "row52", "p234", "row28", "orbslam3"]}, {"id": "I", "nameKey": "pattern.name.I", "title": "I sequence first", "path": "PR and P3 build a local map or mosaic, then A to D register it", "generator": "any A–D after flag Q", "cards": ["footprint_loc", "scalloc", "row116", "row28", "p376", "row27 in part"]}], "fit": "a workflow fits iff, after scope classification and the section-6 register are applied, every step's hand-over is covered by a Role and every consumed input is admitted by the consumer's Receives cell — backward consumption additionally by the closed list of rule 3 or the rule-2 swap. It fits with note under spans or implicit positions; otherwise it misfits, citing the step and the failed test.", "q8": "Q8 (restated by counting layer; supersedes v3.3's single sentence): P8 is exercised in 35 of 93 UAV cards; 33 of these are described as acting during operation and 2 are evaluation-only thresholds (lsvl s10, row69 s7; `p8_recount.tsv`). «runtime» means described as acting while the system runs — it includes selection without a reject option (row33) and soft down-weighting (naviloc, row176), which the state layer does not count as acceptance gates (SCHEMA, fix_acceptance_source: within-solver stopping or soft weighting alone does not qualify), and hier_avl, whose coarse fallback is described but whose implementation is not established (REPORT §7 correction). On failure, at the action level 6 cards widen or refresh the search (hier_avl, orthotrack, scalloc, row27, p231, p358) and 5 coast (aeromap3d, row30, row52, row194, p301); at the Run-F mechanism level S4 = 3 (cs_aerialvl — outside the 93 —, p231, p358) and S3 = 8 (the five coasting cards plus row176, row208, scalloc), while orthotrack and row27 are normal reference refresh and scalloc is in-window rescue. None of the 93 is evaluated after a real in-flight loss.", "anchors": "Anchors (definitions; the SCHEMA_en.md / RULINGS_F.md vocabulary and all state counts are unchanged): output_status annotates what produced the P9/exit output per frame (propagated = rule 5's path at the definition level; the S3 membership of 8 is the Run-F recount, see Q8; frozen carry is a defined class with no fixed-sample member); search modes are defined by the fix event and anchor validity (R-2/R-3), not by P4's input type; fix_acceptance_source classifies the acceptance event's rule wherever it lives, including its absence (row33's runtime selection without a reject option stays top_1_without_reject); retained_state partitions P9 forms, coded for the S2 population only; degradation_trigger and recovery_scope keep their non-P8/non-P4 members as state-only values; update_gate is a pre-Run-F clarification column, carried unchanged — its entries do not map onto P8 membership (foundloc and row26 record gates at non-P8 steps; SCHEMA excludes within-solver stopping and soft weighting); evidence_F and the denominators (fixed 100 = 93 + 7 cs_* state-only cards; targeted separate) are untouched.", "rule0": "(rule 0 — previously external conventions, now binding)\n\n- Unit of judgment: the card step. A step spanning consecutive positions is assigned to the\n  first, the others in a note. A step whose outward hand-over is internal to a position's form\n  (a solver choice, p366 s5; staged estimation, row61 s5–s7) takes that position.\n- The section-1 order is the dependency orientation of the main path, not an execution sequence\n  (pilot s2 renders the reference before s3 prepares the query and fits).\n- Steps the scope paragraph excludes are OUTSIDE, not unassigned; OUTSIDE steps do not count\n  against fit.\n- An `optional` entry that is an interchangeable algorithm, training choice or threshold is a\n  variant of its position, not an option.\n- Counting markers: `g` given, `i` implicit, `prev` carried. Implicit retention requires a named\n  retained object and its consumer. P9 at t feeds P4 for t+1; a carried pose consumed by\n  rendering or cropping is read as P9 → P4 (route 3d), then P4 → P2h.\n- The fit rule: a workflow fits iff, after scope classification and the section-6 register are\n  applied, every step's hand-over is covered by a Role and every consumed input is admitted by\n  the consumer's Receives cell — backward consumption additionally by the closed list of rule 3\n  or the rule-2 swap. It fits with note under spans or implicit positions; otherwise it misfits,\n  citing the step and the failed test.", "rules": "Order of the main path (dependency orientation, rule 0): P1, P2s (before the comparison, usually\nbefore flight); then P3 and P4 in either order; P2h; P5; P6; P7; P8; P9. PR runs beside it.\n\nRule 1, forward routes. A position may consume the hand-over of any earlier position that its\n\"Receives\" cell admits. Positions may be skipped, a system may enter wherever its inputs are\ngiven, and it may exit after P4, P7, P8 or P9. The v3.3 list of skipping routes seen so far is a\nrecord and moves to section 5.3; the exit permission of this rule and the predicted-state typing\nin P4's Role remain normative.\n\nRule 2, one swap. P6 may precede P5 when the reference already carries map coordinates (pilot,\nlodloc_v1, row44, hloc); the swapped hand-over into P5 is admitted by P5's cell.\n\nRule 3, backward routes, a closed list.\n\n- a. Re-rank: P5 → P4, evidence restricts the candidates (anyvisloc, wildnav, row46, row27).\n- b. Refine pass in one frame: P7 → P4 or P2h (lodloc_v1, render2loc, lsgs_loc, row87). In\n  ortholoc the result that re-enters is a homography solved from the first matches.\n- c. On failure: P8 → P4 with a wider search (hier_avl, orthotrack, scalloc, row27, orbslam3).\n  **Note (F8): hier_avl's runtime retrieval-after-failure is not established; scalloc's rescue\n  is an implemented in-window branch retry (P8), not a wider search (section 6, Q8). The\n  action-level support rests on orthotrack s7, row27 s10, p358 s11 and orbslam3.**\n- d. Next frame: P9 → P4; or P9 → P5 or P6, correspondences or a keyframe carried from the\n  previous frame (orthotrack, row52, p234, orbslam3).\n- e. Re-prepare the observation: P7 or P5 → P3. Within one query, the solved pose re-renders the\n  observation's own reconstruction and the similarities re-weight its descriptors (row116).\n  Across frames, the matches adapt the encoder (row147 only¹).\n\n**Extending the closed list is structural and requires two cards from different groups; one-card\nlegs are marked ¹.**\n\nRule 4 of v3.3 (PR → P3, P4, P9) is derivable from the receiving cells and moves to section 5.3\nas a record.\n\nRule 5, coasting. When P8 rejects, or no evidence is available, P9 carries the state forward on\nPR or a motion model alone (aeromap3d, row30, row52, row194). Note: P9's cell already admits\nthese inputs — the rule's content is the failure condition under which this path runs.\n\nA structural change is any addition, removal, split or merge of a position, and any change of a\nRole or Receives cell, of the order, of the swap, of the backward list, of the scope, **or of\nrule 0**. The \"Forms seen\" column, the lists of example cards and section 5 are records:\nextending them is not structural. A forward route that unchanged cells already admit is recorded,\nnot structural.", "sourceHash": "2af03fcabc52f1bb93aa89b99a7a64030964290683b33382c2f350a6d85c0416", "i18n": {"zh": {"app.html_title": "定位流程骨架 v3.4 · 交互探索器", "app.eyebrow": "无 GNSS 定位 · 流程探索器", "app.skip": "跳至位置说明", "app.title": "定位流程骨架", "app.theme_dark": "切换深色", "app.theme_light": "切换浅色", "app.source_meta": "based on skeleton v3.4 draft r3 (candidate A), generated 2026-11-16", "app.intro": "从交接的材料读懂流程。点位置看职责；选模式看路径。主链表示依赖方向，P3 / P4 顺序可互换。", "app.filters": "流程筛选", "app.route_help": "路线说明：悬停或点击查看示例卡片", "app.keyboard_help": "Tab 定位 · Enter / 空格选择 · Esc 关闭提示或返回位置说明。前向线为中性墨色；线条交叉不相接。", "app.pattern_box": "所选模式", "app.flow_title": "离线准备 → 当前帧／窗口 → 下一帧", "app.flow_caption": "11 个位置均非必经。可在接收条件允许时跳过；可从 P4、P7、P8 或 P9 退出。", "app.svg_title": "定位流程骨架 v3.4 交互图", "app.svg_description": "离线 P1 到 P2s。在线 P3 和 P4 准备后，经 P2h、P5、P6、P7、P8、P9 输出。PR 馈入 P3、P4、P9。反馈路线 3a 至 3e。点节点或用 Tab 和 Enter 读取。", "app.legend_aria": "练习占比图例", "app.panel_aria": "位置与路线说明", "app.fit_title": "适配规则 · Fit rule（规则 0）", "app.fit_summary": "先应用范围分类与 §6 未表达事项登记；每一步的交接都由某个 Role 覆盖，且每个已消费输入都被消费者的 Receives 接纳，流程才适配。反向消费还须属于规则 3 封闭清单或规则 2 对调。跨位置步骤或隐含位置记为附注适配；否则指出步骤和失败测试，判为不适配。", "app.fit_details": "判读约定与路线规则 · §0、§3", "app.fit_conventions": "判断单位是卡片步骤。连续跨位置归首位置，其余写附注；位置内部交接仍归该位置。范围外步骤记 OUTSIDE；算法、训练选择或阈值变体不另设 option。g = given，i = implicit，prev = carried。隐含保留必须指明对象与消费者。沿用位姿用于渲染/裁剪时，读为 P9 → P4（3d）→ P2h。", "app.route_rules": "规则 1：消费更早位置且 Receives 接纳；允许省略、给定输入处进入；仅列明 P4/P7/P8/P9 可退出。规则 2：参考已有地图坐标时 P6 可先于 P5。规则 3 是封闭反馈清单；扩展须来自不同组的两张卡片，单卡片腿标 ¹。规则 5 的内容是拒绝或缺证据时的失败条件。", "app.q8_summary": "P8 计数与失败动作 · §6 Q8", "app.q8_runtime": "35/93 含 33 个 «runtime»、2 个 «eval»（lsvl s10、row69 s7）。runtime 还含无拒绝选择（row33）、软降权（naviloc、row176），不等于状态层验收门控；hier_avl 粗回退有描述，但实现未建立。", "app.q8_actions": "动作层：6 张扩大/刷新搜索（hier_avl、orthotrack、scalloc、row27、p231、p358），5 张运动传播（aeromap3d、row30、row52、row194、p301）。Run-F 机制层：S4 = 3（cs_aerialvl 不在 93 张内，另有 p231、p358）；S3 = 8（上述 5 张加 row176、row208、scalloc）。orthotrack、row27 是正常参考刷新；scalloc 是窗口内救援。93 张均未在真实飞行失锁后评估。", "app.anchors_summary": "状态层锚点 · §7", "app.anchor.output_status": "output_status：标注每帧 P9 / 出口的产生方式；propagated 对应规则 5 定义，S3=8 是 Run-F 重计。frozen carry 有定义，无固定样本成员。", "app.anchor.search_modes": "search modes：由 fix 事件和锚有效性定义（R-2/R-3），不由 P4 输入类型定义。", "app.anchor.fix_acceptance_source": "fix_acceptance_source：分类验收事件规则及其缺席；row33 仍为 top_1_without_reject。", "app.anchor.retained_state": "retained_state：仅对 S2 总体划分 P9 保留形式。", "app.anchor.degradation": "degradation_trigger / recovery_scope：保留非 P8 / 非 P4 的状态层成员。", "app.anchor.update_gate": "update_gate：Run-F 前的澄清列，不对应 P8 成员；foundloc、row26 的门控在非 P8 步骤。求解器内部停止和软加权不计验收门控。", "app.anchor.evidence": "evidence_F、固定分母 100 = 93 + 7 cs_*（仅状态层）；定向样本单列。", "app.footer_source": "来源：", "app.footer_scope": "· §0–3、§5.1–5.2、§6 Q8、§7 · draft r3 · candidate A · generated 2026-11-16 · FIGWEB-v34-r2", "app.footer_offline": "完整离线单文件 · 样式、脚本、图形与内容均内嵌。中文术语依据 GLOSSARY.md。", "app.noscript": "请启用 JavaScript 以选择位置和模式。适配规则、计数图例及状态说明仍可直接阅读。", "language.button_aria": "切换界面语言", "language.to_en": "English", "language.to_zh": "中文", "pattern.label": "路径模式", "pattern.all": "全部位置", "pattern.name.A": "只检索或读出", "pattern.name.Aprime": "全库比较后读出", "pattern.name.B": "检索、匹配、求解", "pattern.name.C": "先验区域内求解", "pattern. "route.button_aria": "查看 {label} 路线", "text.list_separator": "、", "node.P1.name": "底图产品", "node.P1.role": "测绘或重建交付的地理配准底图，尚未按定位方法整形。", "node.P1.receives": "测绘影像、LiDAR、公共地理数据。", "node.P1.forms": "正射影像或卫星瓦片；DSM/DEM；网格；3DGS/2DGS；LoD、矢量或 POI；稀疏点云；LiDAR 底图；语义三维边缘；高程模型。", "node.P2s.name": "预存参考", "node.P2s.role": "未依赖当前待检验假设而准备的底图材料，覆盖全区域或固定假设集。", "node.P2s.receives": "底图、场景专属训练数据；决定渲染、尺度、旋转、照明或预备区域的传感器先验与条件。", "node.P2s.forms": "带描述子的瓦片或视图库；预渲染视图；位姿描述子网格；地标或模型点；语义距离层；几何/文本索引；编码底图的场景网络；按预定航线照明渲染的参考；载入机载参考。", "node.P2h.name": "按假设生成的参考", "node.P2h.role": "为一个当前位姿假设准备、与观测同形的底图材料。", "node.P2h.receives": "底图或预存参考；一个假设；上一轮的对齐结果。", "node.P2h.forms": "裁剪；渲染；投影或收集底图点；校正/变换瓦片；检索选中的参考；预期测量。", "node.P3.name": "备好的观测", "node.P3.role": "准备哪些帧、何种几何和表示用于比较；若改变几何，还交出回到传感器坐标系的变换。", "node.P3.receives": "原始传感器数据、先验、相对运动、检测器或模型；在假设下将观测变到地图几何时的尺度/高程；上一轮对齐或比较结果。", "node.P3.forms": "选帧；按高度/姿态/航向归一化；通过高程正射校正；多帧正射投影或鸟瞰图；拼接/局部重建；语义或文本；特征/描述子；单目深度；LiDAR 编码；地形高度。", "node.P4.name": "假设", "node.P4.role": "决定下一步检查的候选位姿或底图区域及其已知不确定度；预测状态由 P4 交出。", "node.P4.receives": "先验、沿用状态、相对运动；P3 与 P2s 的检索/投票；较粗一轮的证据；P8 扩大搜索的触发。", "node.P4.forms": "逐查询给定；围绕先验采样；全底图/区域；检索；投票；带或不带运动模型的前次估计；相对运动预测状态；按证据缩小范围。", "node.P5.name": "比对证据", "node.P5.role": "比较观测与参考的结果，尚不是位姿、尚未在地图坐标中；含对应关系的相互一致性筛选。", "node.P5.receives": "P3；P2h 或 P2s；P9 上一帧保留的对应点、关键帧位姿与影像、前帧/影像、特征缓存；参考已带地图坐标时的已锚定对应关系（规则 2 对调）。", "node.P5.forms": "匹配与过滤；光流传播匹配；逐假设相似度、似然、热图或损失；代价体；特征/光度残差；回归对齐。", "node.P6.name": "挂上三维", "node.P6.role": "以地图坐标表达对应关系，维度足以求解位姿。", "node.P6.receives": "对应关系或参考，加上第三维来源；或 P3 与学习得到的地图。", "node.P6.forms": "«measured» DSM/DEM 抬升、渲染深度、底图原生点、测高仪、多帧自身重建；«measured/learned» 回归坐标；«assumed» 零高程/假定高度平面（hier_avl、row27、p366 s8、p338）。", "node.P7.name": "位姿估计", "node.P7.role": "由当前帧/窗口自身证据给出地图坐标系中的位姿、位置或对齐估计，并附质量指标。", "node.P7.receives": "P4 候选、P5 证据或 P6 已锚定对应点；P3 变换；重力、高度/距离、航向、预测位姿等先验。", "node.P7.forms": "PnP/刚性拟合 + RANSAC；残差最小二乘/梯度下降；已评分假设选择；信念加权均值/聚类；平面变换/热图峰值；检索结果读出/混合；按匹配或运动统计选择求解器/分支。", "node.P8.name": "检查", "node.P8.role": "作出信任决定：接受哪些估计或对应点、拒绝，或触发更大范围搜索。", "node.P8.receives": "一个或多个估计或已锚定对应点；质量指标；预测状态。", "node.P8.forms": "«runtime» 内点/质量/一致性阈值、误差下降、不确定度、新息门控（含 p301）、候选可靠性/一致性选择、软降权、失锁测试；«eval» 收敛监控（lsvl）、地形相关误差阈值（row69）。runtime 不等于状态层验收门控。", "node.P9.name": "带到下一帧的状态", "node.P9.role": "保留并输出跨帧融合状态：t 时刻后验带至 t+1，并保留具名支撑材料（对应点、关键帧位姿与影像、前帧/影像、特征缓存、已匹配区域）。", "node.P9.receives": "已接受估计或锚定对应点；相对运动；前次/预测状态；其他绝对传感器或初始 fix；无 P8 时的 P7 估计；保留规则指明的当前观测/参考影像、特征或裁剪，仅供保留。", "node.P9.forms": "位姿或平滑位姿；上次匹配区域；位姿信念；通过滤波或窗口/轨迹优化保留里程计到地图变换，可含在线三角化地标。", "node.PR.name": "相对运动", "node.PR.role": "传感器自身坐标系中的帧间运动或局部轨迹。", "node.PR.receives": "连续传感器数据。", "node.PR.forms": "视觉惯性里程计；视觉里程计/帧间对齐；给定里程计或惯导。", "node.neighbour.0": "P2s / P2h：判断是否针对 P4 当前待检验的候选位姿或区域。高度、姿态、照明、预定航线、逐查询遥测等条件本身不构成假设依赖。覆盖全区域或独立候选集的材料仍属 P2s，即使逐查询生成（row210 s1）；当前候选所对照的具体材料属 P2h（row161 s3、p338 s1）。p300 s3 的窗口库仍有歧义，冻结标签保留。", "node.neighbour.1": "P3：比较前对观测的处理，包括选取与参考比较的帧。里程计后端内部的关键帧调度属于 PR。", "node.neighbour.2": "P4 / P7：只缩小下一步检查范围的是 P4；给出可用估计的是 P7。", "node.neighbour.3": "P5 / P6：尚未或已经在地图坐标中，一步可以兼有。跨帧锚定对应点的保留属 P9；锚定仍属 P6；传播、过滤、扩展属 P5。", "node.neighbour.4": "P5 / P8：对应关系相互一致性筛选属 P5。P8 判断估计、将对应点与预测状态比较，或在多个已解估计中选择。", "node.neighbour.5": "P7 / P9：当前帧/窗口估计或测量更新属 P7，可从预测信念开始；跨帧保留、融合相对运动并输出融合状态属 P9。读取保留信念的点估计/协方差属于该输出。P9(t) → P4(t+1)。隐含保留必须能指明对象及后续消费者，如 p234 的关键帧位姿与影像供后帧匹配。", "panel.position_heading": "位置说明 · §2", "panel.role": "职责 · Role", "panel.receives": "接收 · Receives", "panel.forms": "已见形式 · Forms（记录）", "panel.source_details": "草稿原文 · Role / Receives / Forms", "panel.role_source": "Role", "panel.receives_source": "Receives", "panel.forms_source": "Forms seen", "panel.neighbours": "相邻位置判别", "panel.neighbour_source": "判别原文", "panel.no_p1_neighbour": "§2 未单列 P1 的相邻判别。", "panel.q8_heading": "计数解释 · Q8", "panel.q8_note": "runtime 不等于验收门控。无拒绝选择与软降权也在其中；详见下方 §6 Q8。", "panel.mark_split": "41 张的精确划分仍待完整标记。", "panel.route_no_cards": "PR 示例形式见 PR 位置；§5.3 未为此输入组合单列示例清单。", "count.P1": "{build} 构建 · {receive} 接收 / {denominator}", "count.P6": "{count} / 93 · 测量≈{measured} · 假设≈{assumed}", "count.P8": "{count} / 93 · runtime {runtime} · eval {eval}", "count.other": "{count} / 93", "legend.high": "≥ 2/3：62–93", "legend.mid": "1/3–< 2/3：31–61", "legend.low": "< 1/3：0–30", "legend.note": "边框粗细与灰阶 = 93 张 UAV 卡片中的练习占比，含给定和隐含位置。P1 为 32 构建 + 60 接收 = 92。占比不表示必须执行。", "legend.forward": "前向依赖", "legend.feedback": "虚线：规则 3 反馈；点线：规则 5 条件路径", "legend.singleton": "¹ 单卡片支持：3e 跨帧腿仅 row147", "svg.offline": "OFFLINE · 离线", "svg.online": "ONLINE · 当前帧 / 窗口", "svg.swap_title": "P3 / P4 顺序可互换", "svg.swap_note": "观测与假设在比较前备好。", "svg.pr_title": "PR 旁路", "svg.pr_data": "连续传感器数据 → 相对运动", "svg.pr_feeds": "馈入 P3、P4、P9", "svg.coast_title": "规则 5 · 运动传播", "svg.coast_condition": "P8 拒绝或没有证据时，", "svg.coast_result": "P9 凭 PR 或运动模型推进。", "svg.next_frame": "3d · 下一帧 t+1", "svg.output": "输出 · 位姿 / 融合状态", "route.label_3e": "3e · 跨帧¹", "status.node_updated": "{id} {name}，位置说明已更新。", "tip.position": "位置说明", "tip.route_examples": "示例：", "tip.pr_location": "见 PR 位置", "theme.aria": "切换色彩主题", "view.detailed": "逐路线", "view.toggle": "切换视图", "compact.view": "紧凑", "compact.return_label": "可返回 P4，重新决定看哪里", "compact.return_timing": "同帧精化 3a/3b · 失败扩大搜索 3c · 下一帧 3d", "compact.carried_label": "3d 沿用上一帧对应点（跳过重新匹配）", "compact.footnote": "另有 3e：按后续结果重新准备观测（P5/P7→P3），仅 row116（帧内）、row147（跨帧¹）两篇；见详细版。", "compact.legend": "橙色表示允许返回，并非第二条必经路径；括号表示 P5–P9 任一位置均可返回。", "compact.description": "P5–P9 右侧括号表示可从这一段任一位置返回 P4；另示 3d 沿用对应点；3e 见图例脚注和详细版。"}, "en": {"app.html_title": "Pipeline Skeleton v3.4 · Interactive Explorer", "app.eyebrow": "GNSS-denied · Flow explorer", "app.skip": "Skip to position details", "app.title": "Localization Pipeline Skeleton", "app.theme_dark": "Switch to dark", "app.theme_light": "Switch to light", "app.source_meta": "based on skeleton v3.4 draft r3 (candidate A), generated 2026-11-16", "app.intro": "Read the pipeline from the handed-over material. Click a position for its role; pick a mode for its path. The main chain shows dependency; P3 / P4 may swap.", "app.filters": "Pipeline filters", "app.route_help": "Route help: hover or click to see example cards", "app.keyboard_help": "Tab to move · Enter / Space to select · Esc closes a tip or returns to position details. Forward lines are neutral ink; crossing lines do not connect.", "app.pattern_box": "Selected pattern", "app.flow_title": "Offline preparation → current frame / window → next frame", "app.flow_caption": "None of the 11 positions is mandatory. A position may be skipped if the receiving cells admit it; exit is allowed after P4, P7, P8 or P9.", "app.svg_title": "Localization pipeline skeleton v3.4, interactive diagram", "app.svg_description": "Offline: P1 to P2s. Online: P3 and P4 prepare, then P2h, P5, P6, P7, P8, P9 produce the output. PR feeds P3, P4, P9. Feedback routes 3a to 3e. Click a node, or use Tab and Enter, to read it.", "app.legend_aria": "Usage-share legend", "app.panel_aria": "Position and route details", "app.fit_title": "Fit rule (rule 0)", "app.fit_summary": "After scope classification and the §6 register of unexpressed items are applied, a workflow fits if every step's hand-over is covered by a Role and every consumed input is admitted by the consumer's Receives cell. Backward consumption must also belong to the closed list of rule 3 or the rule-2 swap. Steps spanning positions or implicit positions are fit with note; otherwise the step and failed test are cited and the workflow misfits.", "app.fit_details": "Reading conventions and route rules · §0, §3", "app.fit_conventions": "The unit of judgment is the card step. A step spanning consecutive positions goes to the first, the others in a note; hand-overs internal to a position stay in it. Out-of-scope steps are OUTSIDE; algorithm, training or threshold variants are not options. g = given, i = implicit, prev = carried. Implicit retention must name its object and consumer. A carried pose used for rendering/cropping reads as P9 → P4 (3d) → P2h.", "app.route_rules": "Rule 1: consume any earlier position the Receives cell admits; skipping and entry at given inputs are allowed; only P4/P7/P8/P9 may exit. Rule 2: P6 may precede P5 when the reference already has map coordinates. Rule 3 is a closed feedback list; extension needs two cards from different groups, one-card legs marked ¹. Rule 5 is the failure condition when P8 rejects or evidence is missing.", "app.q8_summary": "P8 counts and failure actions · §6 Q8", "app.q8_runtime": "35 of 93, including 33 «runtime» and 2 «eval» (lsvl s10, row69 s7). runtime also covers selection without reject (row33) and soft down-weighting (naviloc, row176), which are not state-layer acceptance gates; hier_avl's coarse fallback is described but its implementation is not established.", "app.q8_actions": "Action level: 6 cards widen or refresh the search (hier_avl, orthotrack, scalloc, row27, p231, p358); 5 coast (aeromap3d, row30, row52, row194, p301). Run-F mechanism level: S4 = 3 (cs_aerialvl is outside the 93, plus p231, p358); S3 = 8 (the five above plus row176, row208, scalloc). orthotrack and row27 are normal reference refresh; scalloc is in-window rescue. None of the 93 is evaluated after a real in-flight loss.", "app.anchors_summary": "State-layer anchors · §7", "app.anchor.output_status": "output_status: annotates how each frame's P9 / exit output was produced; propagated matches the rule 5 definition, S3 = 8 is the Run-F recount. frozen carry is defined, with no fixed-sample member.", "app.anchor.search_modes": "search modes: defined by the fix event and anchor validity (R-2/R-3), not by P4's input type.", "app.anchor.fix_acceptance_source": "fix_acceptance_source: classifies the acceptance event's rule, including its absence; row33 stays top_1_without_reject.", "app.anchor.retained_state": "retained_state: partitions P9 forms for the S2 population only.", "app.anchor.degradation": "degradation_trigger / recovery_scope: keep their non-P8 / non-P4 members as state-only values.", "app.anchor.update_gate": "update_gate: a pre-Run-F clarification column, not mapped to P8 membership; foundloc and row26 gate at non-P8 steps. Within-solver stopping and soft weighting are not acceptance gates.", "app.anchor.evidence": "evidence_F and the fixed denominator 100 = 93 + 7 cs_* (state-only); targeted samples listed separately.", "app.footer_source": "Source:", "app.footer_scope": "· §0–3, §5.1–5.2, §6 Q8, §7 · draft r3 · candidate A · generated 2026-11-16 · FIGWEB-v34-r2", "app.footer_offline": "Fully offline single file: styles, scripts, graphics and content are embedded. Terminology follows GLOSSARY.md.", "app.noscript": "Enable JavaScript to select positions and patterns. The fit rule, count legend and status notes remain readable.", "language.button_aria": "Switch language", "language.to_en": "English", "language.to_zh": "中文", "pattern.label": "Path pattern", "pattern.all": "All positions", "pattern.name.A": "Retrieval/read-off only", "pattern.name.Aprime": "Full-gallery read-off", "pattern.name.B": "Retrieve, match, solve", "pattern.name.C": "Solve in prior region", "pattern.name.D": "Render and align", "pattern.name.E": "Recursive belief", "pattern.name.F": "Map-anchored odometry", "pattern.name.G": "Regress from observation", "pattern.name.H": "Keyframe evidence carry", "pattern.name.I": "Sequence first", "pattern.note.A": "P4 exits directly, or P4 → P7 reads off or blends; the two branches are shown side by side.", "pattern.note.Aprime": "Compare directly against the whole stored reference, then read off via P5 → P7.", "pattern.note.B": "The P6 anchoring branch and the direct P5 → P7 branch are shown side by side.", "pattern.note.C": "Prior or carried hypothesis; nothing retained, or P9 retains the pose.", "pattern.note.D": "§5.1: C's cell plus S; §5.2 records rule 2. Side-by-side forms are highlighted; branches are not required on every card.", "pattern.note.E": "Per-hypothesis evidence goes through P5 → P7 into the P9 belief.", "pattern.note.F": "Union of the A–D front ends highlighted; after the P8 gate, sis: for the whole area or a fixed set of hypotheses.", "node.P2s.receives": "The map; scene-specific training data; sensor priors and conditions that fix how the reference is rendered or which part is prepared (scale, rotation, illumination, planned region).", "node.P2s.forms": "Gallery of tiles or views with descriptors; pre-rendered views; descriptor grid over poses; landmarks or model points; semantic distance layers; geometric or text index; scene network encoding the map; reference rendered for presumed illumination along the planned route; on-board stored reference.", "node.P2h.name": "Reference at hypothesis", "node.P2h.role": "Map-derived material prepared for one pose hypothesis, in the observation's form.", "node.P2h.receives": "The map or the stored reference; a hypothesis; an alignment from an earlier pass.", "node.P2h.forms": "Crop; render; projected or gathered map points; rectified or warped tile; stored item selected by retrieval; expected measurement.", "node.P3.name": "Prepared observation", "node.P3.role": "Which frames, in which geometry and representation, are prepared for comparison; and the transform back to the sensor frame if geometry was changed.", "node.P3.receives": "Raw sensor data, priors, relative motion, a stored detector or model; the map's scale or elevation with a hypothesis when the observation is brought into map geometry; an alignment or comparison result of an earlier pass.", "node.P3.forms": "Frame choice; normalization by height, attitude or heading; orthorectification through elevation; multi-frame orthoprojection or bird's-eye view; mosaic or local reconstruction; semantics or text; features/descriptors; monocular depth; LiDAR encoding; terrain height.", "node.P4.name": "Hypothesis", "node.P4.role": "Where to look: the candidate poses or map regions to examine next, with their uncertainty if known; the predicted state is a P4 hand-over.", "node.P4.receives": "A prior, the carried state, relative motion; P3 with P2s (retrieval or voting); evidence of a coarser pass; a wider-search trigger of P8.", "node.P4.forms": "Given per query; sampled around a prior; whole map or region; retrieval; voting; previous estimate with or without a motion model; state predicted from relative motion; narrowed by evidence.", "node.P5.name": "Comparison evidence", "node.P5.role": "The outcome of comparing observation and reference, not yet a pose and not yet in map coordinates; includes filtering associations by mutual consistency.", "node.P5.receives": "P3; P2h or P2s; carried material of the previous frame from P9 (correspondences, keyframe pose and image, previous frame or image, feature caches); anchored associations when the reference carries map coordinates (rule-2 swap).", "node.P5.forms": "Matches and their filters; matches propagated by optical flow; similarity, likelihood, heat-map or loss per hypothesis; cost volume; feature or photometric residuals; regressed alignment.", "node.P6.name": "3D attachment", "node.P6.role": "Associations expressed in map coordinates, in enough dimensions to solve the pose.", "node.P6.receives": "Associations or the reference, with a source of the third dimension; or P3 with a learned map.", "node.P6.forms": "«measured» DSM/DEM lift, rendered depth, map-native points, altimeter, the observation's own reconstruction; «measured/learned» regressed coordinates; «assumed» zero-height or assumed-height plane (hier_avl, row27, p366 s8, p338).", "node.P7.name": "Pose estimate", "node.P7.role": "An estimate of pose, position or frame alignment in the map frame for the current frame or window, from that frame's own evidence, with quality indicators.", "node.P7.receives": "Candidates of P4, evidence of P5 or anchored correspondences of P6; the P3 transform; sensor priors (gravity, height or range, heading, predicted pose).", "node.P7.forms": "PnP or rigid fit with RANSAC; least squares or gradient descent on residuals; selection among scored hypotheses; belief weighting then mean or cluster; planar transform or heat-map peak; read-off or blend of retrieved candidates; solver or branch chosen per frame from match or motion statistics.", "node.P8.name": "Check", "node.P8.role": "A decision on trust: which estimates or correspondences are accepted, or a rejection, or a trigger for a wider search.", "node.P8.receives": "One or several estimates, or anchored correspondences; quality indicators; the predicted state.", "node.P8.forms": "«runtime» inlier, quality or consistency threshold, error drop, uncertainty, innovation gate (incl. p301), reliability/agreement selection, down-weighting, lost-state test; «eval» convergence monitor (lsvl), terrain-dependent error threshold (row69). runtime is not a state-layer acceptance gate.", "node.P9.name": "Carried state", "node.P9.role": "Whatever estimate persists across frames and is output as the fused result: the posterior at t, carried to t+1, together with the named supporting material it retains (correspondences, keyframe pose and image, previous frame or image, feature caches, matched map region).", "node.P9.receives": "Accepted estimates or anchored correspondences; relative motion; the previous and predicted state; other absolute sensors or an initial fix; the P7 estimate when no P8 exists; current observation or reference material named by the retention rule, for retention only.", "node.P9.forms": "The pose, possibly smoothed; the map region last matched; a belief over poses; the odometry-to-map transform retained by filter or window/trajectory optimization, possibly with landmarks triangulated online.", "node.PR.name": "Relative motion", "node.PR.role": "Motion between frames, or a local trajectory, in the sensor's own frame.", "node.PR.receives": "Consecutive sensor data.", "node.PR.forms": "Visual-inertial odometry; visual odometry or frame-to-frame alignment; supplied odometry or inertial navigation.", "node.neighbour.0": "P2s or P2h: prepared without, or for, the hypothesis under examination (the candidate pose or region P4 hands over). Priors fixing rendering, scale, rotation or region (height, attitude, illumination, route, telemetry) do not make a reference hypothesis-conditioned. Material for the whole area or a set independent of the current candidate is P2s even if built per query (row210 s1); the item the current hypothesis is examined against is P2h (row161 s3, p338 s1). p300 s3 stays ambiguous.", "node.neighbour.1": "P3: everything done to the observation before comparison, including the choice of frames to compare with the reference. Keyframe scheduling inside an odometry back end belongs to PR.", "node.neighbour.2": "P4 or P7: a step that only restricts what is examined next is P4; one that yields a usable estimate is P7.", "node.neighbour.3": "P5 or P6: not yet, or already, in map coordinates; one step may do both. For carried anchored correspondences, retention is P9, anchoring stays P6, propagation, filtering and extension is P5.", "node.neighbour.4": "P5 or P8: filtering associations by mutual consistency is P5. P8 judges estimates, tests correspondences against a predicted state, or chooses among several solved estimates.", "node.neighbour.5": "P7 or P9: P7 computes the estimate or measurement update for the current frame or window, possibly from a predicted belief. P9 retains across frames, fuses relative motion and outputs the fused state, incl. point estimate or covariance read off the belief. P9(t) → P4(t+1). Implicit retention must name the object and its consumer, e.g. p234's keyframe pose and image for later matching.", "panel.position_heading": "Position details · §2", "panel.role": "Role", "panel.receives": "Receives", "panel.forms": "Forms seen (records)", "panel.source_details": "Draft source · Role / Receives / Forms", "panel.role_source": "Role", "panel.receives_source": "Receives", "panel.forms_source": "Forms seen", "panel.neighbours": "Telling neighbours apart", "panel.neighbour_source": "Source text", "panel.no_p1_ne setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
$('language').onclick=()=>setLanguage(activeLang==='zh'?'en':'zh');
window.addEventListener('hashchange',()=>{const lang=hashParams().get('lang');if(lang&&lang!==activeLang)setLanguage(lang,false);});
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
$('pattern').onchange=renderPattern;
for(const group of ['backward','swap','coast','pr'])$('toggle-'+group).onchange=()=>{hideTip();document.querySelectorAll('#routebar [data-group="'+group+'"]').forEach(b=>b.hidden=!visibleGroup(group));if(selectedRoute&&routeData[selectedRoute].group===group&&!visibleGroup(group))showNode(selectedNode);draw();};
$('reset').onclick=()=>{$('pattern').value='';for(const group of ['backward','swap','coast','pr'])$('toggle-'+group).checked=true;document.querySelectorAll('#routebar button').forEach(b=>b.hidden=false);selectedNode='P4';renderPattern();showNode('P4');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('tooltip').hidden){hideTip();}else if(selectedRoute){showNode(selectedNode);const target=document.querySelector('[data-node="'+selectedNode+'"]');if(target)target.focus();hideTip();}}});
window.addEventListener('scroll',()=>{if(tipTarget&&(tipTarget===document.activeElement||tipTarget.matches(':hover')))showTip(tipTarget,$('tooltip').textContent);else hideTip();},{passive:true});window.addEventListener('resize',hideTip);
</script>
</body>
</html>
